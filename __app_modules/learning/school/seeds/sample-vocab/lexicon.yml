# Card ladder lexicon — the sample-vocab word package (invented sample words, English meanings).
# Synthetic worked example: every term is an invented syllable string, so no real course
# content lives in the repo. The household's real packages are seeded from the data volume
# (data/content/school/seeds/<package>/) with the same script.
# Installed to media/school/language/sample-vocab/lexicon.yml.
# Ids are permanent once studied (status is keyed by them); `group` is the course
# unit that FIRST introduced the word and names its media folder
# (words/<group>/<id>/{image.jpg, term.mp3, gloss.mp3}).
# Decoys: at least 3 per side, confusable, never the answer; an in-set decoy
# must be the same kind (phrase decoys only from phrases).
schema: school.word-lexicon/v2
package: sample-vocab
language:
  code: ko
  name: Korean
gloss:
  code: en
  name: English
program:
  title: Sample words
quiz:
  topics: [sample, vocabulary]
  instructions: Not sure of a word? Open Sample words on the Portal and review the cards, then come back.
