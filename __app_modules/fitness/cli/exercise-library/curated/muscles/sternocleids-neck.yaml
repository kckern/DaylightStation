name: "Anterior Neck Flexors"
slug: "sternocleids-neck"
group: "neck"
description: "The deep muscles at the front of the neck, including the longus colli and longus capitis, that flex the cervical spine and hold the head in alignment."
full_description: "Beneath the sternocleidomastoid lies a set of deep cervical flexors — chiefly the longus colli and longus capitis, with the rectus capitis anterior and lateralis — running along the front of the cervical vertebrae.\n\nThey flex the cervical spine and, more importantly, provide the low-level continuous support that holds the head balanced over the shoulders. Where the sternocleidomastoid is a strong prime mover, these are endurance stabilisers.\n\nThey are commonly weak and poorly coordinated in people with forward-head posture or after whiplash, and the chin-tuck exercise is the standard way to retrain them. The corpus keeps this as a separate entry from the sternocleidomastoid, so both are preserved here."
