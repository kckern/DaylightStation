name: "Hip Flexors"
slug: "hip-flexors"
group: "hips"
description: "A group led by the iliopsoas and rectus femoris that draws the thigh toward the torso and stabilises the lumbar spine and pelvis."
full_description: "The hip flexors are a functional group rather than one muscle. The iliopsoas — the psoas major joined by the iliacus — is the deepest and strongest, running from the lumbar vertebrae and inner pelvis to the lesser trochanter of the femur. The rectus femoris, sartorius, and tensor fasciae latae assist.\n\nThey flex the hip, which means either lifting the thigh toward a fixed trunk or drawing the trunk toward fixed thighs — the second is why they work hard during sit-ups. The psoas also crosses the lumbar spine, giving it a direct role in spinal and pelvic stability.\n\nLeg raises, knee raises, and marching drills load them; extended sitting shortens them, which is why hip-flexor mobility work is so widely prescribed."
