schema: skyline-glider-course/v1
id: cloud-ridge
version: 6
zone: alpine
act: 2
name: Cloud Ridge
description: Use your four bike buttons for laser, bomb, missile and boost.
  Shoot the bracketed targets, bomb the bunkers below, break the cracked wall
  with a missile and boost through the gate before it shuts.
duration_s: 240
control_cues:
  - at_s: 14
    text: Top left fires the laser. Shoot the bracketed targets — don't fly into them!
  - at_s: 64
    text: Top right drops a bomb. Bomb the bunkers on the ground — a partner can stomp the mat to drop one too!
  - at_s: 99
    text: Bottom left fires a missile. Only a missile breaks the cracked wall!
  - at_s: 155
    text: Fly through the gap in the gate. Bottom right boosts you ahead.
  - at_s: 196
    text: That gate is closing — boost now to dash through!
