name: "Sternocleidomastoid"
slug: "sternocleidomastoid-scm"
group: "neck"
description: "The prominent strap muscle running diagonally across the front of the neck, rotating and flexing the head."
full_description: "The sternocleidomastoid has two heads, one from the manubrium of the sternum and one from the medial clavicle, which join and insert on the mastoid process behind the ear. It is the most visible muscle of the anterior neck.\n\nActing on one side it rotates the head toward the opposite shoulder while tilting it toward the same one. Acting together, both sides flex the neck and can assist inspiration by elevating the sternum and clavicles. It also plays a large part in simply holding the head upright against gravity.\n\nNeck flexion holds and controlled rotation work train it. Sustained forward-head posture keeps it chronically shortened and is a common source of tension headaches."
