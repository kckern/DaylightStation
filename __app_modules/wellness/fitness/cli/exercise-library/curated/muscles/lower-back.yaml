name: "Lower Back"
slug: "lower-back"
group: "back"
description: "The lumbar portion of the erector spinae and surrounding musculature, responsible for extending the spine and resisting flexion under load."
full_description: "The lower back is not a single muscle but a region dominated by the lumbar portion of the erector spinae — the iliocostalis, longissimus, and spinalis columns — running alongside the vertebrae from the sacrum and iliac crest upward.\n\nActing together on both sides they extend the spine; acting on one side they produce lateral flexion. In most loaded training their more important job is isometric: resisting flexion so the spine stays neutral while the hips and legs do the work. That is what is being trained during a deadlift, a good morning, or a loaded carry, even though no visible spinal movement occurs.\n\nBack extensions, hyperextensions, and bird dogs load the region directly."
