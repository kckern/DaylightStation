id: b321cde7-0e68-4b24-86c2-b3a7f4ea956b
name: "Lower Abs"
slug: "abs-lower"
group: "core"
description: "A training term for the lower portion of the rectus abdominis, emphasised when the pelvis moves toward the ribcage rather than the ribcage toward the pelvis."
full_description: "The rectus abdominis is a single continuous muscle running from the pubic crest to the fifth through seventh costal cartilages, divided by tendinous intersections into the visible segments commonly called the six-pack. It cannot contract in isolated halves.\n\n\"Lower abs\" is therefore a training convention rather than a distinct anatomical muscle. It describes exercises where the pelvis is drawn toward a fixed ribcage — reverse crunches, hanging leg raises, hip raises — which biases activation toward the inferior fibres, as opposed to the classic crunch, where the ribcage moves toward a fixed pelvis.\n\nThe distinction is useful for programming and is preserved here because the exercise records use it, but it should not be read as a separate muscle."
