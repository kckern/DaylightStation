# Lakeside Crossroads: one connected overworld composition.
# The player arrives from the homestead, descends the bluff, and chooses the
# west woods, south road, or the fisherman's house and dock to the east.
viewport: [896, 640]
background: '#3e8948'
ground: terrain.grass-middle#grass.middle
world_scale: 2
depth_sort: y
fail_on_clipping: true
review_regions:
  - { id: garden-fence, rect: [20, 170, 230, 170], scale: 3 }
  - { id: house-bridge, rect: [250, 220, 280, 240], scale: 2 }
  - { id: dock-shore, rect: [540, 370, 250, 240], scale: 2 }
  - { id: shoreline, rect: [650, 190, 246, 440], scale: 2 }
  - { id: crossroads, rect: [0, 390, 650, 250], scale: 2 }

terrain:
  grid: { cell: [16, 16] }
  regions:
    - terrain: village-trail
      asset: terrain.adventure-atlas
      polarity: positive
      continues: [west, south]
      rects:
        - [8, 7, 5, 3]    # compact homestead yard beneath the door
        - [4, 9, 4, 1]    # worn one-tile garden-to-homestead connection
        - [10, 8, 3, 9]   # bluff crossing and approach
        - [9, 12, 3, 3]   # subtle westward bend
        - [9, 14, 5, 2]   # crossroads widens only at the decision point
        - [0, 14, 10, 2]  # two-cell west woods exit
        - [10, 15, 3, 5]  # bridge-width south road exit; no unsupported concave bites
        - [13, 14, 7, 2]  # direct, full-width dock approach
      z: 6

    # Organic bluff silhouette around one consistent bridge crossing.
    - terrain: west-bluff
      asset: terrain.earthen-cliff
      polarity: positive
      continues: [west]
      rects: [[0, 10, 10, 2]]
      z: 10
    - terrain: east-bluff
      asset: terrain.earthen-cliff
      polarity: positive
      rects: [[13, 10, 9, 2]]
      z: 10

    # A lake bay continues beyond the east and south edges; it is scenery, not
    # an isolated blue capsule. The dock occupies the eroded western inlet.
    - terrain: east-lake
      asset: terrain.grass-water
      polarity: positive
      opacity: 0.78
      continues: [east, south]
      rects:
        - [25, 7, 3, 2]
        - [23, 8, 5, 2]
        - [24, 10, 4, 2]
        - [21, 11, 7, 3]
        - [19, 13, 9, 3]  # recessed dock cove
        - [20, 16, 8, 2]  # water continues beneath the projecting half of the pier
        - [22, 18, 6, 2]
      z: 5

placements:
  # The homestead is the one architectural landmark; the dock is secondary.
  - { asset: structure.wood-house-1-red, at: [320, 288], z: 20, depth_sort: true }
  - { asset: structure.wood-bridge#vertical, at: [320, 296], z: 15, depth_sort: false }

  # A reviewed deck-tile prefab runs directly from the path into the pond.
  - { prefab: fishing.dock-east, at: [576, 448], z: 15, depth_sort: false }

  # Two center tiles carry the worn path through the garden's southeast gate.
  - { asset: terrain.adventure-atlas#path.center, at: [120, 280], z: 6, depth_sort: false }
  - { asset: terrain.adventure-atlas#path.center, at: [152, 280], z: 6, depth_sort: false }

  # The bed follows the fence's measured visible bounds exactly: x=54..181,
  # y=216..279. A grid-aligned region would visibly leak past the fence.
  - { asset: terrain.garden-soil#soil.center, at: [54, 216], z: 3, depth_sort: false }
  - { asset: terrain.garden-soil#soil.center, at: [86, 216], z: 3, depth_sort: false }
  - { asset: terrain.garden-soil#soil.center, at: [118, 216], z: 3, depth_sort: false }
  - { asset: terrain.garden-soil#soil.center, at: [150, 216], z: 3, depth_sort: false }
  - { asset: terrain.garden-soil#soil.center, at: [54, 248], z: 3, depth_sort: false }
  - { asset: terrain.garden-soil#soil.center, at: [86, 248], z: 3, depth_sort: false }
  - { asset: terrain.garden-soil#soil.center, at: [118, 248], z: 3, depth_sort: false }
  - { asset: terrain.garden-soil#soil.center, at: [150, 248], z: 3, depth_sort: false }

  # Complete five-cell garden boundary with a two-cell south gate.
  - { asset: prop.wood-fence#horizontal.start, at: [32, 188], z: 20, depth_sort: true }
  - { asset: prop.wood-fence#horizontal.middle, at: [64, 188], z: 20, depth_sort: true }
  - { asset: prop.wood-fence#horizontal.middle, at: [96, 188], z: 20, depth_sort: true }
  - { asset: prop.wood-fence#horizontal.middle, at: [128, 188], z: 20, depth_sort: true }
  - { asset: prop.wood-fence#horizontal.end, at: [160, 188], z: 20, depth_sort: true }
  - { asset: prop.wood-fence#vertical.middle, at: [32, 220], z: 20, depth_sort: true }
  - { asset: prop.wood-fence#vertical.middle, at: [32, 252], z: 20, depth_sort: true }
  - { asset: prop.wood-fence#vertical.middle, at: [172, 220], z: 20, depth_sort: true }
  - { asset: prop.wood-fence#vertical.middle, at: [172, 252], z: 20, depth_sort: true }
  - { asset: prop.wood-fence#horizontal.bottom.start, at: [32, 280], z: 20, depth_sort: true }
  - { asset: prop.wood-fence#horizontal.bottom.middle, at: [64, 280], z: 20, depth_sort: true }
  - { asset: prop.wood-fence#horizontal.bottom.end, at: [96, 280], z: 20, depth_sort: true }

  # Two dense crop beds vary by species and stage; the center is a work aisle.
