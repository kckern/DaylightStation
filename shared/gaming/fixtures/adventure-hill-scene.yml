# Lakeside Crossroads: one connected overworld composition.
# The player arrives from the homestead, descends the bluff, and chooses the
# west woods, south road, or the fisherman's house and dock to the east.
viewport: [896, 640]
background: '#3e8948'
ground: terrain.grass-middle#grass.middle
world_scale: 2
depth_sort: y
fail_on_clipping: true
fail_on_frame_edge_contact: true
forbid_direct_autotile_frames: true
review_regions:
  - { id: garden-fence, rect: [20, 170, 230, 170], scale: 3 }
  - { id: fence-northwest-junction, rect: [20, 170, 70, 90], scale: 5 }
  - { id: fence-northeast-junction, rect: [180, 170, 70, 100], scale: 5 }
  - { id: fence-southwest-junction, rect: [20, 250, 80, 80], scale: 5 }
  - { id: house-bridge, rect: [250, 220, 280, 240], scale: 2 }
  - { id: house-path-cliff-join, rect: [230, 260, 100, 100], scale: 4 }
  - { id: dock-shore, rect: [540, 370, 250, 240], scale: 2 }
  - { id: dock-north-landing, rect: [560, 425, 150, 90], scale: 4 }
  - { id: dock-south-landing, rect: [560, 475, 150, 100], scale: 4 }
  - { id: mature-tree-base, rect: [160, 135, 90, 80], scale: 5 }
  - { id: south-bank-tree-base, rect: [510, 525, 90, 110], scale: 4 }
  - { id: shoreline, rect: [650, 190, 246, 440], scale: 2 }
  - { id: crossroads, rect: [0, 390, 650, 250], scale: 2 }

# Structural joins are checked in native connector space before the scene is
# written. A fence piece that is visually near its neighbour but not actually
# connected makes scene-qa fail.
connections:
  - { from: [garden.nw, east], to: [garden.north-1, west] }
  - { from: [garden.north-1, east], to: [garden.north-2, west] }
  - { from: [garden.north-2, east], to: [garden.north-3, west] }
  - { from: [garden.north-3, east], to: [garden.north-4, west] }
  - { from: [garden.north-4, east], to: [garden.ne, west] }
  - { from: [garden.nw, south], to: [garden.west-1, north] }
  - { from: [garden.west-1, south], to: [garden.west-2, north] }
  - { from: [garden.west-2, south], to: [garden.sw, north] }
  - { from: [garden.ne, south], to: [garden.east-1, north] }
  - { from: [garden.east-1, south], to: [garden.east-cap, north] }
  - { from: [garden.sw, east], to: [garden.south-1, west] }
  - { from: [garden.south-1, east], to: [garden.south-cap, west] }

terrain:
  grid: { cell: [16, 16] }
  regions:
    - terrain: village-trail
      asset: terrain.adventure-atlas
      polarity: positive
      continues: [west, south]
      rects:
        - [8, 7, 5, 3]    # compact homestead yard beneath the door
        - [4, 9, 4, 1]    # worn one-tile garden-to-homestead connection
        - [7, 10, 3, 1]   # underpainted beneath the bluff to suppress a path/rock grass seam
        - [10, 8, 3, 9]   # bluff crossing and approach
        - [9, 12, 3, 3]   # subtle westward bend
        - [9, 14, 5, 2]   # crossroads widens only at the decision point
        - [0, 14, 10, 2]  # two-cell west woods exit
        - [10, 15, 3, 5]  # bridge-width south road exit; no unsupported concave bites
        - [13, 14, 5, 2]  # path terminates exactly where the over-water dock begins
      z: 6

    # Organic bluff silhouette around one consistent bridge crossing.
    - terrain: west-bluff
      asset: terrain.earthen-cliff
      polarity: positive
      continues: [west]
      rects: [[0, 10, 10, 2]]
      z: 10
    - terrain: east-bluff
      asset: terrain.earthen-cliff
      polarity: positive
      rects: [[13, 10, 9, 2]]
      z: 10

    # A lake bay continues beyond the east and south edges; it is scenery, not
    # an isolated blue capsule. The dock occupies the eroded western inlet.
    - terrain: east-lake
      asset: terrain.grass-water
      polarity: positive
      opacity: 0.78
      continues: [east, south]
      rects:
        # One-cell shoreline steps form a deliberate northwest-facing bank.
        # Starts never reverse direction, so the contour cannot form an
        # unsupported concave notch or a two-cell block jump.
        - [25, 7, 3, 1]
        - [24, 8, 4, 1]
        - [23, 9, 5, 1]
        - [22, 10, 6, 1]
        - [21, 11, 7, 1]
        - [20, 12, 8, 1]
        - [19, 13, 9, 1]  # bank reaches the north side of the dock
        - [18, 14, 10, 6] # water continues beneath the dock; bank resumes at its west edge
      z: 5

    # The cultivated bed uses its own measured origin inside the fence. It is
    # still semantic terrain, so all four soil corners and edges are selected
    # from the reviewed farmland set rather than painted as raw center tiles.
    - terrain: garden-bed
      asset: terrain.farmland
      polarity: positive
      origin: [54, 216]
      rects: [[0, 0, 4, 2]]
      z: 3

placements:
  # The homestead is the one architectural landmark; the dock is secondary.
  - { asset: structure.wood-house-1-red, at: [320, 288], z: 20, depth_sort: true }
  - { asset: structure.wood-bridge#vertical, at: [320, 296], z: 15, depth_sort: false }

  # A reviewed deck-tile prefab runs directly from the path into the pond.
  - { prefab: fishing.dock-east, at: [576, 448], z: 15, depth_sort: false }

  # Six-cell north boundary. Purpose-built derived junction frames own each
  # turn, while all straight runs remain on the 32 px world grid. This avoids
  # overlapping two source posts to fake a corner. The east run ends in a cap,
  # leaving the southeast gate unobstructed.
  - { id: garden.nw, asset: prop.wood-fence-junctions#corner.nw, at: [32, 188], z: 20, depth_sort: true }
  - { id: garden.north-1, asset: prop.wood-fence#horizontal.middle, at: [64, 188], z: 20, depth_sort: true }
  - { id: garden.north-2, asset: prop.wood-fence#horizontal.middle, at: [96, 188], z: 20, depth_sort: true }
  - { id: garden.north-3, asset: prop.wood-fence#horizontal.middle, at: [128, 188], z: 20, depth_sort: true }
  - { id: garden.north-4, asset: prop.wood-fence#horizontal.middle, at: [160, 188], z: 20, depth_sort: true }
  - { id: garden.ne, asset: prop.wood-fence-junctions#corner.ne, at: [192, 188], z: 20, depth_sort: true }
  - { id: garden.west-1, asset: prop.wood-fence#vertical.middle, at: [32, 220], z: 20, depth_sort: true }
  - { id: garden.west-2, asset: prop.wood-fence#vertical.middle, at: [32, 252], z: 20, depth_sort: true }
  - { id: garden.east-1, asset: prop.wood-fence#vertical.middle, at: [192, 220], z: 20, depth_sort: true }
  - { id: garden.east-cap, asset: prop.wood-fence#vertical.end, at: [192, 246], z: 21, depth_sort: true }
  - { id: garden.sw, asset: prop.wood-fence-junctions#corner.sw, at: [32, 284], z: 20, depth_sort: true }
  - { id: garden.south-1, asset: prop.wood-fence#horizontal.bottom.middle, at: [64, 284], z: 20, depth_sort: true }
  - { id: garden.south-cap, asset: prop.wood-fence#horizontal.cap-east, at: [96, 284], z: 20, depth_sort: true }

  # Two dense crop beds vary by species and stage; the center is a work aisle.
  - { asset: crop.tomato#young, at: [72, 228], z: 18, depth_sort: true }
  - { asset: crop.tomato#mature, at: [96, 228], z: 18, depth_sort: true }
  - { asset: crop.carrot#young, at: [144, 228], z: 18, depth_sort: true }
  - { asset: crop.carrot#mature, at: [168, 228], z: 18, depth_sort: true }
  - { asset: crop.tomato#mature, at: [72, 258], z: 18, depth_sort: true }
  - { asset: crop.tomato#ripe, at: [96, 258], z: 18, depth_sort: true }
  - { asset: crop.carrot#mature, at: [144, 258], z: 18, depth_sort: true }
  - { asset: crop.carrot#ripe, at: [168, 258], z: 18, depth_sort: true }
  - { asset: crop.tomato#sprout, at: [72, 284], z: 18, depth_sort: true }
  - { asset: crop.carrot#sprout, at: [168, 284], z: 18, depth_sort: true }

  # Lake details are sparse and activity-driven: dock, fisher, moored boat.
  - { asset: prop.boat#default, at: [732, 532], z: 18, depth_sort: true }
  - { asset: prop.cattails#still, at: [704, 288], z: 16 }
  - { asset: prop.cattails#sway.1, at: [728, 302], z: 16 }
  - { asset: prop.cattails#sway.2, at: [750, 292], z: 16 }
  - { asset: prop.outdoor-decor#grass.tuft-a, at: [684, 306], z: 16, depth_sort: true }
  - { asset: prop.water-rock#still, at: [718, 566], z: 16, depth_sort: true }

  # Woodland masses frame the destinations and break the bluff face naturally.
  - { asset: prop.big-oak-tree#tree.a, at: [58, 164], z: 20, depth_sort: true }
  - { asset: prop.big-oak-tree#tree.a, at: [214, 168], z: 20, depth_sort: true, flip_x: true }
  - { asset: prop.small-oak-tree#tree.a, at: [142, 104], z: 20, depth_sort: true }
  - { asset: prop.big-oak-tree#tree.a, at: [180, 598], z: 20, depth_sort: true, flip_x: true }
  - { asset: prop.big-oak-tree#tree.a, at: [96, 452], z: 20, depth_sort: true, flip_x: true }
  - { asset: prop.big-oak-tree#tree.a, at: [560, 420], z: 20, depth_sort: true, flip_x: true }
  - { asset: prop.big-oak-tree#tree.a, at: [690, 196], z: 20, depth_sort: true }
  - { asset: prop.big-oak-tree#tree.a, at: [758, 236], z: 20, depth_sort: true, flip_x: true }
  - { asset: prop.outdoor-decor#shrub.leafy, at: [790, 246], z: 20, depth_sort: true }
  - { asset: prop.outdoor-decor#shrub.low, at: [806, 256], z: 20, depth_sort: true }
  - { asset: prop.big-oak-tree#tree.a, at: [472, 620], z: 20, depth_sort: true, flip_x: true }
  - { asset: prop.small-oak-tree#tree.a, at: [548, 598], z: 20, depth_sort: true, flip_x: true }

  # Ground texture is concentrated beneath canopy and near moist shoreline.
  - { asset: terrain.adventure-atlas#grass.patch-c, at: [32, 96], z: 2 }
  - { asset: terrain.adventure-atlas#grass.patch-a, at: [96, 128], z: 2 }
  - { asset: terrain.adventure-atlas#grass.patch-b, at: [192, 96], z: 2 }
  - { asset: terrain.adventure-atlas#grass.patch-c, at: [224, 160], z: 2 }
  - { asset: terrain.adventure-atlas#grass.patch-b, at: [192, 352], z: 2 }
  - { asset: terrain.adventure-atlas#grass.patch-c, at: [256, 576], z: 2 }
  - { asset: terrain.adventure-atlas#grass.patch-a, at: [608, 96], z: 2 }
  - { asset: terrain.adventure-atlas#grass.patch-c, at: [704, 128], z: 2 }
  - { asset: terrain.adventure-atlas#grass.patch-a, at: [640, 288], z: 2 }
  - { asset: terrain.adventure-atlas#grass.patch-b, at: [800, 256], z: 2 }
  - { asset: terrain.adventure-atlas#grass.patch-c, at: [832, 384], z: 2 }
  - { asset: terrain.adventure-atlas#grass.patch-b, at: [768, 576], z: 2 }

  # Tracks form directional sequences through the crossroads.
  - { asset: terrain.path-detail#pebbles.a, at: [256, 256], z: 7 }
  - { asset: terrain.path-detail#pebbles.c, at: [336, 414], z: 7 }
  - { asset: terrain.path-detail#pebbles.a, at: [232, 464], z: 7 }
  - { asset: terrain.path-detail#pebbles.b, at: [336, 480], z: 7 }
  - { asset: terrain.path-detail#pebbles.a, at: [344, 558], z: 7 }
  - { asset: terrain.path-detail#pebbles.c, at: [552, 464], z: 7 }

  # Purposeful obstacles: crossing rocks, lakeside reeds, and reward grove.
  - { asset: prop.outdoor-decor#rock.land-b, at: [194, 410], z: 20, depth_sort: true, flip_x: true }
  - { asset: prop.outdoor-decor#rock.land-b, at: [216, 414], z: 20, depth_sort: true }
  - { asset: prop.outdoor-decor#rock.land-c, at: [232, 406], z: 20, depth_sort: true }
  - { asset: prop.outdoor-decor#grass.tuft-b, at: [178, 410], z: 19, depth_sort: true }
  - { asset: prop.outdoor-decor#grass.tuft-a, at: [246, 412], z: 19, depth_sort: true }
  - { asset: prop.outdoor-decor#shrub.leafy, at: [610, 416], z: 20, depth_sort: true }
  - { asset: prop.outdoor-decor#shrub.low, at: [628, 414], z: 20, depth_sort: true }
  - { asset: prop.outdoor-decor#rock.land-c, at: [646, 416], z: 20, depth_sort: true }
  - { asset: prop.fallen-log#plain, at: [146, 574], z: 20, depth_sort: true }

  # Activity owners and one optional reward make the route choices legible.
  - asset: npc.miner-mike#idle.down
    at: [368, 466]
    z: 20
    depth_sort: true
    shadow: { size: [11, 4], offset: [0, 1], opacity: 0.35 }
  - asset: npc.farmer-bob#idle.down.0
    at: [152, 314]
    z: 20
    depth_sort: true
    shadow: { size: [13, 4], offset: [0, 1], opacity: 0.35 }
  - asset: npc.fisherman-fin#idle.down
    at: [634, 496]
    z: 20
    depth_sort: true
    shadow: { size: [11, 4], offset: [0, 1], opacity: 0.35 }
