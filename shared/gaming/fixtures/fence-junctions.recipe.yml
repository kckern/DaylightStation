canvas: [64, 16]
layers:
  # Each junction is a single, continuous 16 px post with one horizontal arm.
  # The raw sheet only supplies straight segments; overlapping those as separate
  # scene objects creates gaps or double-post silhouettes at turns.
  - { source: assets/default/environment/props/fences.png, rect: [16, 0, 16, 16], at: [0, 0] }
  - { source: assets/default/environment/props/fences.png, rect: [0, 16, 16, 16], at: [0, 0] }
  - { source: assets/default/environment/props/fences.png, rect: [48, 0, 16, 16], at: [16, 0] }
  - { source: assets/default/environment/props/fences.png, rect: [0, 16, 16, 16], at: [16, 0] }
  - { source: assets/default/environment/props/fences.png, rect: [16, 48, 16, 16], at: [32, 0] }
  - { source: assets/default/environment/props/fences.png, rect: [0, 16, 16, 16], at: [32, 0] }
  - { source: assets/default/environment/props/fences.png, rect: [48, 48, 16, 16], at: [48, 0] }
  - { source: assets/default/environment/props/fences.png, rect: [0, 16, 16, 16], at: [48, 0] }
