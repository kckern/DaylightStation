schema_version: 1
game_id: card-game
title: Card Game
view_id: pokemon-practice-journey-v1
ruleset: pokemon-practice-journey-v1
players:
  min: 1
  max: 1

presentation:
  theme: pokemon-stadium
  data_source: PokeAPI
  sounds:
    enabled: true

journey:
