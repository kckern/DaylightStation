schema_version: 1
game_id: card-game
title: Scale Stadium
view_id: pokemon-practice-journey-v1
ruleset: pokemon-practice-journey-v1
players:
  min: 1
  max: 1

presentation:
  theme: pokemon-stadium
  data_source: PokeAPI
  sounds:
    enabled: true

journey:
  version: 1
  score_version: 1
  player_health: 100
  partners:
    - id: bulbasaur
      name: Bulbasaur
      type: grass
      genus: Seed Pokémon
      dex: "0001"
      asset: games/pokemon/svg/0001-bulbasaur-gen1.svg
      evolution:
        id: ivysaur
        name: Ivysaur
        dex: "0002"
        asset: games/pokemon/svg/0002-ivysaur-gen1.svg
      move_ids: [vine-whip, growl, growth, razor-leaf]
    - id: charmander
      name: Charmander
      type: fire
      genus: Lizard Pokémon
      dex: "0004"
      asset: games/pokemon/svg/0004-charmander-gen1.svg
      evolution:
        id: charmeleon
        name: Charmeleon
        dex: "0005"
        asset: games/pokemon/svg/0005-charmeleon-gen1.svg
      move_ids: [ember, smokescreen, dragon-dance, fire-fang]
    - id: squirtle
      name: Squirtle
      type: water
      genus: Tiny Turtle Pokémon
      dex: "0007"
      asset: games/pokemon/svg/0007-squirtle-gen1.svg
      evolution:
        id: wartortle
        name: Wartortle
        dex: "0008"
        asset: games/pokemon/svg/0008-wartortle-gen1.svg
      move_ids: [water-gun, withdraw, work-up, aqua-tail]
  opponents:
    - id: pidgey
      name: Pidgey
      type: normal
      genus: Tiny Bird Pokémon
      dex: "0016"
      asset: games/pokemon/svg/0016-pidgey-gen1.svg
      health: 90
      intents:
        - { id: gust, title: Gust, kind: attack, amount: 15 }
        - { id: sand-attack, title: Sand Attack, kind: defend, amount: 9 }
        - { id: quick-attack, title: Quick Attack, kind: attack, amount: 17 }
    - id: meowth
      name: Meowth
      type: normal
      genus: Scratch Cat Pokémon
      dex: "0052"
      asset: games/pokemon/svg/0052-meowth-gen1.svg
      health: 105
      intents:
        - { id: scratch, title: Scratch, kind: attack, amount: 17 }
        - { id: hone-claws, title: Hone Claws, kind: charge, amount: 5 }
        - { id: pay-day, title: Pay Day, kind: attack, amount: 19 }
    - id: snorlax
      name: Snorlax
      type: normal
      genus: Sleeping Pokémon
      dex: "0143"
      asset: games/pokemon/svg/0143-snorlax-gen1.svg
      health: 120
      intents:
        - { id: tackle, title: Tackle, kind: attack, amount: 19 }
        - { id: amnesia, title: Amnesia, kind: defend, amount: 12 }
        - { id: belly-drum, title: Belly Drum, kind: charge, amount: 6 }
        - { id: body-slam, title: Body Slam, kind: attack, amount: 22 }

cards:
  vine-whip:
    title: Vine Whip
    type: attack
    move_type: grass
    practice_label: Scale attack
    description: Play an adaptive scale to lash the opponent.
    cost: 0
    damage: 44
    challenge: &scale_challenge
      domain: piano
      kind: scale
      requirements: { curriculum: pokemon-journey-foundations }
      timeout_ms: 90000
    outcomes: &journey_outcomes
      - { id: bullseye, min_score: 0.9, multiplier: 1.25, label: Direct hit · bullseye, power_label: Direct 125% }
      - { id: direct-hit, min_score: 0.75, multiplier: 1, label: Direct hit, power_label: Direct 100% }
      - { id: partial-hit, min_score: 0.5, multiplier: 0.65, label: Partial hit, power_label: Partial 65% }
      - { id: miss, min_score: 0, multiplier: 0.25, label: Miss · practice still counts, power_label: Miss 25% }
  growl:
    title: Growl
    type: guard
    move_type: normal
    practice_label: Chord guard
    description: Voice a clean chord to attack and build a shield.
    cost: 0
    damage: 28
    block: 16
    challenge: &chord_challenge
      domain: piano
      kind: chord
      requirements: { curriculum: pokemon-journey-foundations }
      timeout_ms: 90000
    outcomes: *journey_outcomes
  growth:
    title: Growth
    type: focus
    move_type: grass
    practice_label: Arpeggio focus
    description: Shape an arpeggio and store power for the next move.
    cost: 0
    damage: 32
    focus: 14
    challenge: &arpeggio_challenge
      domain: piano
      kind: arpeggio
      requirements: { curriculum: pokemon-journey-foundations }
      timeout_ms: 90000
    outcomes: *journey_outcomes
  razor-leaf:
    title: Razor Leaf
    type: attack
    move_type: grass
    practice_label: Rhythm signature
    description: Lock a short note pattern to the beat for a big hit.
    signature: true
    cost: 0
    damage: 58
    challenge: &timed_challenge
      domain: piano
      kind: timed-pattern
      requirements: { curriculum: pokemon-journey-foundations }
      timeout_ms: 90000
    outcomes: *journey_outcomes

  ember:
    title: Ember
    type: attack
    move_type: fire
    practice_label: Scale attack
    description: Play an adaptive scale to spark a bright attack.
    cost: 0
    damage: 44
    challenge: *scale_challenge
    outcomes: *journey_outcomes
