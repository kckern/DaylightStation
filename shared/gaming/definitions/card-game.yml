schema_version: 1
game_id: card-game
title: Riff Raiders
view_id: card-battle-v1
ruleset: card-battle-v1
players:
  min: 1
  max: 1

card_battle:
  turn_mode: tactical
  opening_hand: 4
  hand_size: 4
  player:
    health: 14
    max_energy: 3
  upgrades:
    - id: second-wind
      title: Second Wind
      description: Start the next battle with 2 extra health.
      effect:
        max_health: 2
    - id: opening-note
      title: Opening Note
      description: Start the next battle with 2 focus.
      effect:
        starting_focus: 2
  enemy:
    id: iron-conductor
    name: Iron Conductor
    health: 24
    intents:
      - id: baton-strike
        title: Baton Strike
        kind: attack
        amount: 4
      - id: iron-tempo
        title: Iron Tempo
        kind: defend
        amount: 5
      - id: crescendo
        title: Crescendo
        kind: charge
        amount: 3
      - id: downbeat
        title: Crushing Downbeat
        kind: attack
        amount: 5
  challenge_pools:
    major-scales:
      selection: rotate
      prompts:
        - scale:
            tonic: C
            octave: 4
            mode: major
            direction: ascending
            octaves: 1
          max_mistakes: 3
        - scale:
            tonic: G
            octave: 4
            mode: major
            direction: ascending
            octaves: 1
          max_mistakes: 3
        - scale:
            tonic: F
            octave: 4
            mode: major
            direction: ascending
            octaves: 1
          max_mistakes: 3
        - scale:
            tonic: D
            octave: 4
            mode: major
            direction: ascending
            octaves: 1
          max_mistakes: 3
  deck:
    - quick-cut
    - quick-cut
    - resonant-blow
    - resonant-blow
    - brace
    - brace
    - fortify
    - fortify
    - tune-up
    - tune-up
    - finale
    - finale

cards:
  quick-cut:
    title: Quick Cut
    type: attack
    description: A light attack that leaves energy for another card.
    cost: 1
    damage: 2
    challenge: &scale_challenge
      domain: piano
      kind: scale
      pool: major-scales
    outcomes: &scale_outcomes
      - id: fluent
        min_score: 1
        multiplier: 1
      - id: recovered
        min_score: 0.5
        multiplier: 0.65
      - id: fizzled
        min_score: 0
        multiplier: 0

  resonant-blow:
    title: Resonant Blow
    type: attack
    description: Trade most of your energy for a heavy hit.
    cost: 2
    damage: 5
    challenge: *scale_challenge
    outcomes: *scale_outcomes

  brace:
    title: Brace
    type: guard
    description: Block the Conductor's announced attack.
    cost: 1
    block: 4
    challenge: *scale_challenge
    outcomes: *scale_outcomes

  fortify:
    title: Fortify
    type: guard
    description: Commit two energy to a stronger defense.
    cost: 2
    block: 7
    challenge: *scale_challenge
    outcomes: *scale_outcomes

  tune-up:
    title: Tune Up
    type: focus
    description: Add power to your next attack, even next turn.
    cost: 1
    focus: 3
    challenge: *scale_challenge
    outcomes: *scale_outcomes

  finale:
    title: Finale
    type: attack
    description: Cash in stored focus for a decisive strike.
    cost: 2
    damage: 4
    challenge: *scale_challenge
    outcomes: *scale_outcomes
