# ------------------------------------------------------------
# logs.kckern.net  ->  victoria-logs:9428
# ------------------------------------------------------------
# Deploys to the Nginx Proxy Manager container at
#   /data/nginx/proxy_host/logs.conf
# and is picked up by nginx.conf's `include /data/nginx/proxy_host/*.conf`.
#
# WHY A HAND-WRITTEN CONF RATHER THAN A HOST CREATED IN THE NPM UI:
# NPM owns the NUMERIC filenames in that directory and regenerates them from
# its database, so naming this `85.conf` would put it in the path of the next
# host someone adds in the UI — silently overwritten, or worse, half-matching
# a different domain. A non-numeric name is outside the space NPM allocates
# from, so the two can coexist. The tradeoff is that this host does not appear
# in the NPM UI; this file is the source of truth for it.
#
# ACCESS CONTROL — DO NOT REMOVE THE server_proxy INCLUDE AT THE BOTTOM.
# The log store has NO authentication of its own, and its API includes write
# endpoints (/insert/*). The custom server_proxy include returns 444 for any
# request whose source is neither Cloudflare nor the LAN, which is the same
# perimeter every other host here sits behind (see the geo block in
# /data/nginx/custom/http_top.conf and docs/reference/core/network-exposure.md).
# Without it this would be an unauthenticated, internet-reachable log database.
#
# The *.kckern.net wildcard (npm-6) already covers this name, so no new
# certificate is issued and nothing needs to be requested from Let's Encrypt.

server {
  set $forward_scheme http;
  set $server         "victoria-logs";
  set $port           9428;

  listen 80;
  listen [::]:80;

  listen 443 ssl;
  listen [::]:443 ssl;

  server_name logs.kckern.net;

  http2 off;

  # Let's Encrypt SSL
  include conf.d/include/letsencrypt-acme-challenge.conf;
  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;
  ssl_certificate /etc/letsencrypt/live/npm-6/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/npm-6/privkey.pem;

  # Asset Caching
  include conf.d/include/assets.conf;

  # Block Exploits
  include conf.d/include/block-exploits.conf;

  # Force SSL
  include conf.d/include/force-ssl.conf;

  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $http_connection;
  proxy_http_version 1.1;

  access_log /data/logs/proxy-host-logs_access.log proxy;
  error_log /data/logs/proxy-host-logs_error.log warn;

  # Bare root -> the built-in web UI, which the app itself serves at
  # /select/vmui/. This is an exact-match location, so ONLY `/` is affected —
  # the API under /select/logsql/* still falls through to `location /` below
  # and is untouched.
  #
  # A redirect rather than an internal rewrite on purpose: the UI requests its
  # own assets from absolute /select/vmui/ paths, so rewriting the root while
  # leaving the address bar at `/` breaks on the first stylesheet.
  location = / {
    return 302 /select/vmui/;
  }

  location / {
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;

    # Proxy!
    include conf.d/include/proxy.conf;

    # Live tailing (/select/logsql/tail) is a long-lived streaming response:
    # results are written as they are found, not at the end. The defaults
    # inherited from proxy.conf would buffer that into silence and then cut it
    # off at the read timeout, so a tail would appear to hang and die. These
    # two lines are the difference between the endpoint working and not.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # Custom
  include /data/nginx/custom/server_proxy[.]conf;
}
