<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>fitness sidebar harness</title>
  <style>
    html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; background: #0a0a14; overflow: hidden; }
    body { font-family: system-ui, sans-serif; }
    /* The app gets Roboto Condensed from Google Fonts (frontend/index.html); the
       harness uses the repo's local Regular + SemiBold so wrapping matches the kiosk. */
    @font-face { font-family: 'Roboto Condensed'; font-weight: 100 500; font-style: normal; font-display: block; src: url('/harness-fonts/RobotoCondensed-Regular.ttf') format('truetype'); }
    @font-face { font-family: 'Roboto Condensed'; font-weight: 600 900; font-style: normal; font-display: block; src: url('/harness-fonts/RobotoCondensed-SemiBold.ttf') format('truetype'); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/sidebarMain.jsx"></script>
</body>
</html>
