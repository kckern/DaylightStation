title: 'Korean 3-2 · Lesson 1: Helping others'
courseId: korean-3-2
sequence: 1
subject: language
description: Practice 19 vocabulary and model-expression cards, then demonstrate the two grammar patterns on paper.
reading: Textbook pages 14–23; workbook pages 4–8.
sourceTitle: 재외동포를 위한 한국어 3-2
objectives:
  - Recognize Lesson 1 vocabulary and model expressions in both directions.
  - Ask permission with -아/어도 되다.
  - Offer an intended action with -(으)ㄹ 테니까 before a request or suggestion.
passing:
  percent: 100
