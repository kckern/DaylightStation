  questionCards:
    permission-01:
      cardIds:
        - ask-permission
      kind: application
      explanation: Use -아/어도 돼요? to ask permission. 질문하다 becomes 질문해도 돼요?
    permission-02:
      cardIds:
        - photo-permission
      kind: application
      explanation: 찍다 becomes 찍어도 돼요? when asking permission to take a photo.
    permission-03:
      cardIds:
        - eat-permission
      kind: application
      explanation: 먹다 becomes 먹어도 돼요? when asking permission to eat.
    intention-01:
      cardIds:
        - dad-will-help
      kind: application
      explanation: 도와줄 테니까 says that Dad intends to help, followed by a request or suggestion.
    intention-02:
      cardIds:
        - i-will-hold
      kind: application
      explanation: 안고 있을 테니까 offers to hold something, followed by a request to the other person.
    intention-03:
      cardIds:
        - mom-will-wake
      kind: application
      explanation: 깨워 줄 테니까 offers to wake someone, followed by a request or reassurance.
