# Pokemon Basics printed quiz: each question block pairs a stem with a
# four-bubble omr_response whose itemId equals the question's — the equality
# the scanner and grader agree through. Choices render from
# science/pokemon-basics/01-quiz, so paper and grader cannot drift.
id: pokemon-basics-01-omr
title: Pokemon Basics Quiz
seed: 20260806
variant: 0
target:
  - letter
blocks:
  - type: rich_text
    md: |
      ## Pokemon Basics Quiz

      Fill in ONE bubble for each question. Press hard enough to fill the
      whole circle, and erase completely if you change your mind.

  - type: question
    itemId: pk-q1
    number: 1
    blocks:
      - type: rich_text
        md: Which type is Pikachu?
      - type: omr_response
        itemId: pk-q1
        choices: 4

  - type: question
    itemId: pk-q2
    number: 2
    blocks:
      - type: rich_text
        md: What does Charmander evolve into?
      - type: omr_response
        itemId: pk-q2
        choices: 4

  - type: question
    itemId: pk-q3
    number: 3
    blocks:
      - type: rich_text
        md: Which move is super effective against a Water type?
      - type: omr_response
        itemId: pk-q3
        choices: 4

  - type: question
    itemId: pk-q4
    number: 4
    blocks:
      - type: rich_text
        md: What item heals a fainted Pokemon?
      - type: omr_response
        itemId: pk-q4
        choices: 4

  - type: question
    itemId: pk-q5
    number: 5
    blocks:
      - type: rich_text
        md: Which Pokemon is the Grass starter of Kanto?
      - type: omr_response
        itemId: pk-q5
        choices: 4

  - type: question
    itemId: pk-q6
    number: 6
    blocks:
      - type: rich_text
        md: What do you use to catch a wild Pokemon?
      - type: omr_response
        itemId: pk-q6
        choices: 4

  # The barcode on a printed sheet is a REAL ticket, so it names a token class
  # from the closed set in `sessions/tokens.mjs` and `IssueDocument` mints it at
  # issue time. `recovery` is the honest one here: it is actionable for as long
  # as the work is open and it reprints THIS artifact (same id, same form map).
  #
  # Handing the sheet in is deliberately NOT a barcode — the session reducer
  # gives `submit_work` a null tokenClass because a grown-up marks paper. On the
  # OMR sheet a submit-by-scan would be worse than useless: it would advance the
  # session to `submitted` and lock the mark reader out of its own sheet.
  - type: scan_action
    action: recovery
    label: Scan this code if you need another copy of this sheet
