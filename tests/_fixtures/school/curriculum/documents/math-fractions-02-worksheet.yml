# Unit 02: the printed practice sheet. A parent grades it against the rubric in
# math-fractions.02.yml, so nothing here carries an answer — the sheet the child
# gets and the key the parent gets render from the same blocks.
id: math-fractions-02-worksheet
title: Adding and Subtracting Unlike Denominators
seed: 20260722
variant: 0
target:
  - letter
blocks:
  - type: rich_text
    md: |
      ## Fractions Practice 2

      Work each problem on this page. Show the step where you rewrite the
      fractions with a common denominator, then write the final result in
      **simplest form**. If the result is greater than one, write it as a
      mixed number.

  - type: asset
    ref: school/math/fraction-strips
    alt: A strip diagram showing halves, thirds, quarters, sixths and twelfths stacked to the same total width.

  - type: question
    itemId: u2-q1
    number: 1
    blocks:
      - type: rich_text
        md: Add. Write the result in simplest form.
      - type: math
        tex: '\frac{2}{3} + \frac{1}{4}'
        display: true
      - type: answer_space
        minPt: 54
        maxPt: 90

  - type: question
    itemId: u2-q2
    number: 2
    blocks:
      - type: rich_text
        md: Subtract. Write the result in simplest form.
      - type: math
        tex: '\frac{5}{6} - \frac{1}{4}'
        display: true
      - type: answer_space
        minPt: 54
        maxPt: 90

  - type: question
    itemId: u2-q3
    number: 3
    blocks:
      - type: rich_text
        md: Add the mixed numbers. Regroup if the fraction part comes out greater than one.
      - type: math
        tex: '2\frac{1}{3} + 1\frac{1}{2}'
        display: true
      - type: answer_space
        minPt: 72
        maxPt: 108

  - type: question
    itemId: u2-q4
    number: 4
    blocks:
      - type: rich_text
        md: |
          This stacked fraction means "three quarters divided by one half".
          Simplify it and write the result as a mixed number.
      - type: math
        tex: '\dfrac{\;\frac{3}{4}\;}{\;\frac{1}{2}\;}'
        display: true
      - type: answer_space
        minPt: 72
        maxPt: 108

  - type: question
    itemId: u2-q5
    number: 5
    blocks:
      - type: rich_text
        md: |
          Rewrite both fractions with a common denominator, then write
          `<`, `>` or `=` in the box between them.
      - type: math
        # \fbox switches to text mode, where \phantom is invalid; \enclose{box}
        # keeps the blank in math mode. Caught by the catalog render probe.
        tex: '\frac{3}{5} \;\enclose{box}{\phantom{X}}\; \frac{5}{8}'
        display: true
      - type: answer_space
        minPt: 54
        maxPt: 90

  - type: question
    itemId: u2-q6
    number: 6
    blocks:
      - type: rich_text
        md: |
          Maya walked seven tenths of a mile before breakfast and half a mile
          after lunch. How far did she walk in all? Write the total as a mixed
          number of miles.
      - type: math
        tex: '\frac{7}{10} + \frac{1}{2}'
        display: true
      - type: answer_space
        minPt: 90
        maxPt: 144

  - type: scan_action
    action: scan-worksheet
    label: Scan this page when every problem is finished
