# Unit 03 bank. Every item is multiple_choice with exactly four choices, because
# each one is also printed as a four-bubble omr_response row in
# math-fractions-03-omr. The item ids here ARE the itemIds on the paper: the
# scanned bubble row and the grading engine have to land on the same item.
id: math/math-fractions/03-checkpoint
title: Fractions Checkpoint
subject: math
audience: assigned
unit: math-fractions.03
topics:
  - fractions
  - adding-fractions
  - mixed-numbers
  - comparing-fractions
items:
  - id: u3-q1
    type: multiple_choice
    prompt: What is 1/2 + 1/3?
    choices:
      - 2/5
      - 2/6
      - 5/6
      - 1/6
    answer: 5/6

  - id: u3-q2
    type: multiple_choice
    prompt: What is 3/4 - 1/3?
    choices:
      - 2/12
      - 5/12
      - 1/2
      - 4/7
    answer: 5/12

  - id: u3-q3
    type: multiple_choice
    prompt: Which fraction is equivalent to 6/8?
    choices:
      - 2/3
      - 3/4
      - 4/6
      - 5/8
    answer: 3/4

  - id: u3-q4
    type: multiple_choice
    prompt: Write 11/4 as a mixed number.
    choices:
      - 1 3/4
      - 2 1/4
      - 2 3/4
      - 3 1/4
    answer: 2 3/4

  - id: u3-q5
    type: multiple_choice
    prompt: Ben ate 1/4 of a pizza and Ann ate 3/8 of the same pizza. How much of the pizza did they eat together?
    choices:
      - 4/12
      - 4/8
      - 5/12
      - 5/8
    answer: 5/8

  - id: u3-q6
    type: multiple_choice
    prompt: Which of these fractions is the greatest?
    choices:
      - 2/3
      - 5/8
      - 3/5
      - 7/12
    answer: 2/3
