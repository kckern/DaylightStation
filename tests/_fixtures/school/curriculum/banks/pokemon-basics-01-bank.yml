# Pokemon Basics unit 01 bank (the e2e journey course). Every item is
# multiple_choice with exactly four choices, mirrored as four-bubble
# omr_response rows in pokemon-basics-01-omr — item ids here ARE the paper's
# itemIds.
id: science/pokemon-basics/01-quiz
title: Pokemon Basics Quiz
subject: science
audience: assigned
unit: pokemon-basics.01
topics:
  - pokemon
  - types
items:
  - id: pk-q1
    type: multiple_choice
    prompt: Which type is Pikachu?
    choices:
      - Water
      - Electric
      - Grass
      - Rock
    answer: Electric

  - id: pk-q2
    type: multiple_choice
    prompt: What does Charmander evolve into?
    choices:
      - Charizard
      - Charmeleon
      - Squirtle
      - Wartortle
    answer: Charmeleon

  - id: pk-q3
    type: multiple_choice
    prompt: Which move is super effective against a Water type?
    choices:
      - Ember
      - Tackle
      - Thunderbolt
      - Splash
    answer: Thunderbolt

  - id: pk-q4
    type: multiple_choice
    prompt: What item heals a fainted Pokemon?
    choices:
      - Potion
      - Antidote
      - Revive
      - Repel
    answer: Revive

  - id: pk-q5
    type: multiple_choice
    prompt: Which Pokemon is the Grass starter of Kanto?
    choices:
      - Bulbasaur
      - Oddish
      - Bellsprout
      - Chikorita
    answer: Bulbasaur

  - id: pk-q6
    type: multiple_choice
    prompt: What do you use to catch a wild Pokemon?
    choices:
      - Rare Candy
      - Poke Ball
      - Escape Rope
      - Bicycle
    answer: Poke Ball
