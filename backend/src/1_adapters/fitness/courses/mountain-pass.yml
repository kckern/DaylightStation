schema: skyline-glider-course/v1
id: mountain-pass
version: 2
name: Mountain Pass
description: Climb from the valley, thread the ice caves, and glide home at sunset.
duration_s: 300
motion:
  filter_s: 0.75
  deadband_rpm: 2
  response_s: 1.5
  max_climb_rate: 0.30
  max_descent_rate: 0.22
  coast_s: 1
  disconnect_grace_s: 0.75
rules:
  lives: 3
  invincibility_s: 1.25
  restart_delay_s: 2
