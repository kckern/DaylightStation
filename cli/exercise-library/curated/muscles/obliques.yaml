id: 3ebab90f-c1f4-4ed8-94cc-d0cf7b052cd1
name: "Obliques"
slug: "obliques"
group: "core"
description: "The internal and external obliques run diagonally along the sides of the abdomen and are the primary rotators and side-benders of the trunk."
full_description: "The obliques are two paired sheets of muscle on either side of the abdomen. The external obliques form the outermost layer, running downward and forward from the lower eight ribs to the iliac crest and linea alba. The internal obliques sit beneath them with fibres running the opposite direction, from the inguinal ligament and iliac crest up to the lower ribs.\n\nBecause their fibres oppose each other, the two layers work as a pair: the external oblique on one side and the internal oblique on the other contract together to rotate the trunk. Acting on one side alone they produce lateral flexion, and acting together with the rectus abdominis they flex the spine and compress the abdomen during forced exhalation.\n\nMovements that load them directly include Russian twists, side bends, oblique crunches, wood chops, and any anti-rotation hold such as a Pallof press."
