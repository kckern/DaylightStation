name: "Peroneus Longus"
slug: "peroneus-longus"
group: "lower-legs"
description: "A muscle on the outer lower leg that everts the foot and supports the arch, stabilising the ankle against rolling."
full_description: "The peroneus longus — also called the fibularis longus — runs down the lateral side of the lower leg from the head and upper shaft of the fibula. Its tendon passes behind the lateral malleolus, crosses beneath the foot, and inserts on the medial cuneiform and first metatarsal.\n\nThat unusual path lets it do two things at once: evert the foot, turning the sole outward, and assist plantarflexion while supporting the transverse arch. Functionally it is the primary defence against an inversion ankle sprain, contracting to resist the foot rolling inward.\n\nCalf raises recruit it, and banded eversion work and balance drills on unstable surfaces target it directly."
