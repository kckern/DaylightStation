name: "Tibialis Anterior"
slug: "tibialis-anterior-shin"
group: "lower-legs"
description: "The muscle along the front of the shin that dorsiflexes the ankle, lifting the foot during the swing phase of walking and running."
full_description: "The tibialis anterior runs down the front of the lower leg from the lateral condyle and upper shaft of the tibia to the medial cuneiform and first metatarsal.\n\nIt dorsiflexes the ankle — pulling the toes toward the shin — and inverts the foot. During gait it lifts the forefoot so the toes clear the ground on the swing through, then lowers the foot under control after heel strike. Weakness produces foot drop and a slapping footfall.\n\nIt is the direct antagonist of the calf complex and is often comparatively undertrained, which is associated with shin splints in runners. Toe raises, heel walks, and banded dorsiflexion train it."
