id: 21cee991-cecd-4702-b0cf-5c5fc53983b6
name: "Teres Major"
slug: "teres-major"
group: "back"
description: "A thick round muscle from the outer border of the scapula to the humerus, adducting and internally rotating the arm alongside the lats."
full_description: "The teres major originates on the lower lateral border of the scapula and inserts on the medial lip of the intertubercular groove of the humerus, immediately adjacent to the latissimus dorsi tendon.\n\nIts actions mirror the lats closely: adduction, extension, and internal rotation of the humerus. Because of that overlap it is sometimes called \"the lat’s little helper.\" It differs in one respect — it does not cross the spine or pelvis, so it contributes nothing to trunk movement and acts purely on the shoulder.\n\nPull-ups, pulldowns, and rows all recruit it. Its bulk sits at the rear armpit and contributes noticeably to back width."
