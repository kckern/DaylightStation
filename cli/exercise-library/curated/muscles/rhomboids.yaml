name: "Rhomboids"
slug: "rhomboids"
group: "shoulders"
description: "The rhomboid major and minor sit between the spine and the shoulder blades, retracting and downwardly rotating the scapula."
full_description: "The rhomboid minor runs from the seventh cervical and first thoracic vertebrae to the upper medial border of the scapula; the rhomboid major runs from the second through fifth thoracic vertebrae to the medial border below it. Both lie beneath the trapezius.\n\nTheir principal action is retraction — drawing the shoulder blades toward the spine. They also elevate the medial border and downwardly rotate the scapula, and they stabilise it against the ribcage during pulling.\n\nProlonged desk posture leaves them lengthened and weak while the chest tightens, a pattern rowing movements are commonly prescribed to correct. Face pulls, seated rows, and prone T raises target them; the corpus files them under shoulders rather than back."
