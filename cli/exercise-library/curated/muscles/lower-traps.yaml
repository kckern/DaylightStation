name: "Lower Trapezius"
slug: "lower-traps"
group: "back"
description: "The lower third of the trapezius, running from the mid-thoracic vertebrae up to the shoulder blade. It depresses and upwardly rotates the scapula."
full_description: "The trapezius is one large muscle with three functionally distinct regions. The lower fibres arise from roughly the fourth through twelfth thoracic vertebrae and travel upward and outward to the medial end of the scapular spine.\n\nBecause the fibres pull downward and inward, they depress the scapula and assist the serratus anterior in upward rotation — the motion that lets the arm move overhead without the shoulder impinging. Weak or inhibited lower traps are a common contributor to shoulder pain, since the upper traps then dominate and the scapula shrugs rather than rotates.\n\nProne Y raises, overhead carries, and controlled scapular pull-ups target them; so does any row performed with deliberate scapular depression."
