name: "Gluteus Medius"
slug: "glute-medius"
group: "upper-legs"
description: "A fan-shaped muscle on the outer pelvis that abducts the hip and keeps the pelvis level during single-leg stance."
full_description: "The gluteus medius originates on the outer surface of the ilium and inserts on the greater trochanter of the femur, lying partly beneath the gluteus maximus.\n\nIts anterior fibres internally rotate the hip and its posterior fibres externally rotate it, but its most important role is frontal-plane stability. Every time weight shifts onto one leg — walking, running, climbing stairs — the medius on the stance side contracts to stop the opposite side of the pelvis from dropping. Weakness shows up as a visible hip drop or as the knee collapsing inward under load.\n\nSide-lying leg raises, banded lateral walks, single-leg squats, and step-ups all train it."
