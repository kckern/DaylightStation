<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Arcade Film</title>
<style>
  /* This page is drawn by the kiosk in a fill-width / WRAP-HEIGHT,
     NOT_FOCUSABLE, NOT_TOUCHABLE APPLICATION_OVERLAY window, on top of a running
     game. Three consequences shape everything below:
       1. Height must come from real flow height — `position:fixed` collapses the
          window to nothing — so the film is pinned to the display height in JS.
       2. Every pixel not drawn shows the game, so the page stays transparent and
          renders NOTHING when there is nothing to say.
       3. It cannot take focus or swallow input, which is what lets it sit over
          gameplay without pausing it. */
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;color:#fff;
    font-family:"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #film{position:relative;width:100%;background:transparent}

  #banner{position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;
    display:none;align-items:center;gap:28px;padding:22px 40px;
    background:linear-gradient(180deg,rgba(14,16,22,.94),rgba(8,9,13,.98));
    border-top:4px solid #ffd666;box-shadow:0 -10px 50px rgba(0,0,0,.8)}
  #banner.show{display:flex;animation:rise .5s cubic-bezier(.2,.9,.25,1.1) both}
  @keyframes rise{from{transform:translateY(140px);opacity:0}to{transform:translateY(0);opacity:1}}

  #av{width:110px;height:110px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:#222;
    border:4px solid #ffd666;box-shadow:0 0 26px rgba(255,214,102,.6);animation:bob 2.6s ease-in-out infinite}
  #av[hidden]{display:none}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  #name{font-size:46px;font-weight:700;line-height:1}
  #sub{font-size:20px;color:#ffd666;margin-top:8px;letter-spacing:.16em;text-transform:uppercase}
  .spacer{flex:1 1 auto}
  .timer{text-align:right;min-width:420px}
  #clock{font-variant-numeric:tabular-nums;font-size:104px;font-weight:800;line-height:.9;
    text-shadow:0 0 30px rgba(255,214,102,.55)}
  #label{font-size:20px;letter-spacing:.22em;text-transform:uppercase;color:#9aa4b2;margin-top:10px}
  .bar{margin-top:14px;height:12px;border-radius:12px;background:rgba(255,255,255,.14);overflow:hidden}
  #fill{height:100%;border-radius:12px;background:linear-gradient(90deg,#7ee787,#ffd666);transition:width 1s linear}
  #bar[hidden]{display:none}

  body.warn #banner{border-top-color:#ff8a4c}
  body.warn #clock{color:#ffb37a;animation:pulse 1s ease-in-out infinite}
  body.warn #fill{background:linear-gradient(90deg,#ffd666,#ff8a4c)}
  body.crit #banner{border-top-color:#ff5656}
  body.crit #clock{color:#ff6b6b;animation:pulse .6s ease-in-out infinite}
  body.crit #fill{background:linear-gradient(90deg,#ff8a4c,#ff5656)}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.8}}

  /* A frozen clock that still looks authoritative is worse than one that plainly
     admits it has lost contact — it tells a child they have time they may not. */
  body.stale #banner{border-top-color:#6b7280;filter:saturate(.25)}
  body.stale #clock{color:#9aa4b2;animation:none}
  body.stale #label::after{content:" — no contact";color:#ff8a4c}

  #toast{position:absolute;top:40px;left:50%;transform:translateX(-50%);display:none;
    padding:20px 44px;border-radius:999px;font-size:38px;font-weight:600;
    background:rgba(10,12,18,.94);border:3px solid #ffd666;box-shadow:0 10px 40px rgba(0,0,0,.7)}
  #toast.show{display:block;animation:drop .45s cubic-bezier(.2,.9,.25,1.1) both}
  @keyframes drop{from{transform:translate(-50%,-90px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
</style></head>
<body>
<div id="film">
  <div id="toast"></div>
  <div id="banner">
    <img id="av" alt="" hidden>
    <div><div id="name">—</div><div id="sub">Arcade time</div></div>
    <div class="spacer"></div>
    <div class="timer">
      <div id="clock">--:--</div><div id="label">remaining</div>
      <div class="bar" id="bar"><div id="fill" style="width:100%"></div></div>
    </div>
  </div>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var DEVICE = q.get('device') || '';
  var STALE_MS = Number(q.get('staleMs') || 45000);

  var film = document.getElementById('film');
  var banner = document.getElementById('banner');
  var toastEl = document.getElementById('toast');
  var avEl = document.getElementById('av');
  var clockEl = document.getElementById('clock');
  var labelEl = document.getElementById('label');
  var fillEl = document.getElementById('fill');
  var barEl = document.getElementById('bar');

  // Pin to the display so the wrap-height overlay covers the screen.
  function size() { film.style.height = (window.screen.height || 1080) + 'px'; }
  size(); window.addEventListener('resize', size);

  var session = null;        // { playedMs, remainingMs|null, at }
  var ticker = null, toastT = null, lastMessageAt = 0;

  function two(n) { return (n < 10 ? '0' : '') + n; }
  function hhmmss(ms) {
    var t = Math.max(0, Math.round(ms / 1000));
    var m = Math.floor(t / 60), s = t % 60;
    return two(m) + ':' + two(s);
  }

  function render() {
    if (!session) return;
    var drift = Date.now() - session.at;
    if (session.remainingMs === null) {
      // No budget known yet (metering not granted): show honest elapsed time
      // rather than inventing a countdown.
      clockEl.textContent = hhmmss(session.playedMs + drift);
      labelEl.textContent = 'played';
      barEl.hidden = true;
      document.body.classList.remove('warn', 'crit');
      return;
    }
    var left = Math.max(0, session.remainingMs - drift);
    clockEl.textContent = hhmmss(left);
    labelEl.textContent = left <= 0 ? "time's up" : 'remaining';
    barEl.hidden = false;
    fillEl.style.width = (session.grantedMs ? Math.max(0, (left / session.grantedMs) * 100) : 0) + '%';
    document.body.classList.toggle('crit', left <= 60000);
    document.body.classList.toggle('warn', left > 60000 && left <= 180000);
  }

  function startTicking() { if (!ticker) ticker = setInterval(render, 1000); }
  function stopTicking() { if (ticker) { clearInterval(ticker); ticker = null; } }

  function show(m) {
    document.getElementById('name').textContent = m.displayName || m.userId || 'Player';
    document.getElementById('sub').textContent = m.title || 'Arcade time';
    // A user with no portrait on file should show nothing, not an empty ring.
    if (m.userId) {
      avEl.onerror = function () { avEl.hidden = true; };
      avEl.onload = function () { avEl.hidden = false; };
      avEl.hidden = true;
      avEl.src = '/api/v1/static/img/users/' + encodeURIComponent(m.userId) + '.jpg';
    } else { avEl.hidden = true; }
    banner.classList.add('show');
    startTicking();
  }

  function clear() {
    banner.classList.remove('show');
    toastEl.classList.remove('show');
    document.body.className = '';
    session = null; stopTicking();
  }

  function toast(text, ms) {
    if (!text) return;
    toastEl.textContent = text; toastEl.classList.add('show');
    if (toastT) clearTimeout(toastT);
    toastT = setTimeout(function () { toastEl.classList.remove('show'); }, ms || 5000);
  }

  function handle(m) {
    if (!m || (DEVICE && m.deviceId && m.deviceId !== DEVICE)) return;
    lastMessageAt = Date.now();
    document.body.classList.remove('stale');

    if (m.event === 'play.session.ended') { clear(); return; }
    if (m.overlay === 'toast') { toast(m.text, m.ms); return; }
    if (m.event !== 'play.session.started' && m.event !== 'play.session.progress') return;

    session = {
      playedMs: Number(m.playedMs || 0),
      grantedMs: m.grantedMs != null ? Number(m.grantedMs) : null,
      remainingMs: m.remainingMs != null ? Number(m.remainingMs) : null,
      at: Date.now(),
    };
    if (m.event === 'play.session.started') show(m);
    else if (!banner.classList.contains('show')) show(m);
    if (m.warning) toast(m.warning, 6000);
    render();
  }

  // Losing contact must be visible. A countdown that keeps ticking on stale data
  // is a lie told confidently.
  setInterval(function () {
    if (!banner.classList.contains('show')) return;
    if (lastMessageAt && Date.now() - lastMessageAt > STALE_MS) {
      document.body.classList.add('stale');
      stopTicking();
    }
  }, 5000);

  // Deliberate seam: lets the film's states be driven and screenshotted in a
  // headless browser, so its appearance can be verified without taking over a
  // television. Read-only entry point — it feeds the same handler the socket does.
  window.__arcadeFilm = { handle: handle, clear: clear, toast: toast };

  var ws, retry = 0;
  function connect() {
    try {
      ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    } catch (e) { setTimeout(connect, 5000); return; }
    ws.onopen = function () {
      retry = 0;
      var topics = DEVICE ? ['play-session:' + DEVICE] : [];
      ws.send(JSON.stringify({ type: 'bus_command', action: 'subscribe', topics: topics }));
    };
    ws.onmessage = function (e) { try { handle(JSON.parse(e.data)); } catch (_) {} };
    ws.onclose = function () {
      retry = Math.min(retry + 1, 6);
      setTimeout(connect, 500 * Math.pow(2, retry));
    };
    ws.onerror = function () { try { ws.close(); } catch (_) {} };
  }
  connect();
})();
</script>
</body></html>
