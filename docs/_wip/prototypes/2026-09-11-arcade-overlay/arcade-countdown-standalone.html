<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arcade Overlay</title>
<style>
  /* FKB renders this in a fill-width / WRAP-HEIGHT overlay window, so the page
     must have natural flow height. No position:fixed, no height:100%. */
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;
    font-family:"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .card{box-sizing:border-box;width:100%;display:flex;align-items:center;gap:28px;
    padding:22px 40px;
    background:linear-gradient(180deg,rgba(14,16,22,.94),rgba(8,9,13,.98));
    border-top:4px solid #ffd666;
    box-shadow:0 -10px 50px rgba(0,0,0,.8);
    animation:rise .5s cubic-bezier(.2,.9,.25,1.1) both}
  @keyframes rise{from{transform:translateY(120px);opacity:0}to{transform:translateY(0);opacity:1}}
  .av{width:110px;height:110px;border-radius:50%;object-fit:cover;flex:0 0 auto;
    border:4px solid #ffd666;box-shadow:0 0 26px rgba(255,214,102,.6);
    animation:bob 2.6s ease-in-out infinite;background:#222}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .who{flex:0 0 auto}
  .name{font-size:46px;font-weight:700;color:#fff;line-height:1}
  .sub{font-size:20px;color:#ffd666;margin-top:8px;letter-spacing:.16em;text-transform:uppercase}
  .spacer{flex:1 1 auto}
  .timer{flex:0 0 auto;text-align:right;min-width:420px}
  .clock{font-variant-numeric:tabular-nums;font-size:104px;font-weight:800;line-height:.9;color:#fff;
    text-shadow:0 0 30px rgba(255,214,102,.55)}
  .label{font-size:20px;letter-spacing:.22em;text-transform:uppercase;color:#9aa4b2;margin-top:10px}
  .bar{margin-top:14px;height:12px;border-radius:12px;background:rgba(255,255,255,.14);overflow:hidden}
  .fill{height:100%;border-radius:12px;background:linear-gradient(90deg,#7ee787,#ffd666);
    transition:width 1s linear}
  .warn .card{border-top-color:#ff8a4c}
  .warn .clock{color:#ffb37a;animation:pulse 1s ease-in-out infinite}
  .warn .fill{background:linear-gradient(90deg,#ffd666,#ff8a4c)}
  .crit .card{border-top-color:#ff5656}
  .crit .clock{color:#ff6b6b;animation:pulse .6s ease-in-out infinite}
  .crit .fill{background:linear-gradient(90deg,#ff8a4c,#ff5656)}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.8}}
</style></head>
<body>
<div id="wrap">
  <div class="card">
    <img class="av" id="av" alt="">
    <div class="who">
      <div class="name" id="name">Test Learner</div>
      <div class="sub">Arcade time</div>
    </div>
    <div class="spacer"></div>
    <div class="timer">
      <div class="clock" id="clock">--:--</div>
      <div class="label" id="label">remaining</div>
      <div class="bar"><div class="fill" id="fill" style="width:100%"></div></div>
    </div>
  </div>
</div>
<script>
  var q=new URLSearchParams(location.search);
  var user=q.get('user')||'test-learner';
  var name=q.get('name')||user.charAt(0).toUpperCase()+user.slice(1);
  var total=parseInt(q.get('secs')||'300',10), left=total;
  document.getElementById('name').textContent=name;
  document.getElementById('av').src='/api/v1/static/img/users/'+user+'.jpg';
  var wrap=document.getElementById('wrap');
  function two(n){return (n<10?'0':'')+n}
  function tick(){
    var m=Math.floor(left/60),s=left%60;
    document.getElementById('clock').textContent=two(m)+':'+two(s);
    document.getElementById('fill').style.width=Math.max(0,(left/total)*100)+'%';
    wrap.className = left<=60?'crit':(left<=180?'warn':'');
    if(left<=0){document.getElementById('label').textContent="time's up";return}
    left--;setTimeout(tick,1000);
  }
  tick();
</script>
</body></html>
