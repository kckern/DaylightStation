# Merge into Home Assistant's scripts.yaml, then call script.reload (or restart
# Home Assistant). The backend supplies `locked_until` and `source` variables.
public_kiosk_shutdown_cue:
  alias: Public kiosk shutdown cue
  mode: restart
  sequence:
    - service: notify.mobile_app_kc_phone
      data:
        title: Public kiosk shutdown
        message: >-
          Lockdown started from {{ source | default('NFC') }}.
          Kiosks stay unavailable until {{ locked_until | default('the configured expiry') }}.

school_worksheet_scan_notification:
  alias: School worksheet scan notification
  mode: queued
  max: 20
  sequence:
    - variables:
        # School Room Siren (Z-Wave node 23) custom library:
        # 1 perfect, 2 pass, 3 fail, 4 error.
        tone_id: >-
          {% if result == 'passed' and percent | float == 100 %}1
          {% elif result == 'passed' %}2
          {% elif result == 'needs_remediation' %}3
          {% else %}4
          {% endif %}
    - service: mqtt.publish
      data:
        topic: zwave/_CLIENTS/ZWAVE_GATEWAY-zwave-js-ui/api/sendCommand/set
        payload: >-
          {"args":[{"nodeId":23,"commandClass":121},"play",[{{ tone_id | int }}]]}
    - service: notify.mobile_app_kc_phone
      data:
        title: "Worksheet {{ result | default('scan') | title }}"
        message: >-
          {{ student | default(learner_id | default('Unknown student')) }} —
          {{ course | default('Course unknown') }} / {{ unit | default('Unit unknown') }} /
          {{ lesson | default('Lesson unknown') }}.
          Score: {{ earned | default('?') }}/{{ total | default('?') }}
          ({{ percent | default('?') }}%).
