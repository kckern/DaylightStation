; DaylightStation omr-relay firmware — M5Stack ATOM Lite (ESP32-PICO-D4).
; (Same board as food-scale-relay / barcode-relay — one toolchain for all three.
;  An ATOMS3 Lite also works but forks you onto an ESP32-S3 env for no benefit;
;  this relay only needs one UART + WiFi.)
;
; Taps the RS-232 serial output of a Chatsworth Data OMR-1100 bubble-sheet
; scanner (via an M5 ATOMIC RS232 base / MAX3232) and streams decoded sheet
; reads over WebSocket to the DaylightStation event bus (/ws), which re-
; broadcasts the `omr` topic. See ../README.md.
;
; NO BLE here — transport is a plain UART. That's the whole point of this
; relay vs. barcode-relay: no bonding, no proprietary GATT.
;
; PREREQ (one-time): generate include/config.h from the household SSOT —
;   node tools/gen-config.mjs <dataDir>/household/config/omr-readers.yml [reader-id]
;
; Build + flash:
;   node tools/flash.mjs <dataDir>/household/config/omr-readers.yml [reader-id]
; or directly:
;   pio run -e m5-atom -t upload --upload-port /dev/cu.usbserial-XXXX

[env:m5-atom]
platform = espressif32@6.5.0     ; Arduino-ESP32 2.0.x (IDF 4.4)
board = m5stack-atom             ; ESP32-PICO-D4; button GPIO39, SK6812 RGB GPIO27
framework = arduino
monitor_speed = 115200
; Dual-OTA layout: two 1.92 MB app slots. This USED to be huge_app.csv ("WiFi+WS
; is big; no OTA") — a single app slot, which made OTA impossible and every fix a
; trip to the reader with a USB cable. That note predated anyone measuring the
; binary: the image is ~1 MB, so it fits a 1.92 MB slot with ~50% headroom.
; Nothing in this firmware uses SPIFFS, so the smaller data partition costs
; nothing. CHANGING THIS REQUIRES ONE MORE USB FLASH — the partition table lives
; at 0x8000, outside any app slot, so it cannot be delivered over the air.
board_build.partitions = min_spiffs.csv
build_flags =
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  links2004/WebSockets@^2.4.1     ; arduinoWebSockets (WS client)
  bblanchon/ArduinoJson@^7.1.0
  fastled/FastLED@^3.6.0          ; single onboard RGB status LED
  ; --- optional NFC tap reader (M5 Unit NFC, SKU U216, ST25R3916) ------------
  ; Only linked in when NFC_ENABLED is 1 in the generated config.h; an OMR-only
  ; reader keeps its original ~30% flash footprint.
  ; M5Unified is NOT pulled in transitively by M5Unit-NFC (its library.json
  ; declares only M5UnitUnified), so it has to be named explicitly or the build
  ; fails on a missing M5Unified.h.
  m5stack/M5Unified@^0.2.0
  https://github.com/m5stack/M5Unit-NFC.git

; --- over-the-air upload -----------------------------------------------------
; Same build as m5-atom; only the delivery differs. Use this instead of taking
; the reader apart for a USB cable:
;
;   pio run -e m5-atom-ota -t upload --upload-port <device-ip> \
;     --upload-flags --auth=<ota.password from household hardware/omr/readers.yml>
;
; The password is deliberately NOT stored here — it is household data, and this
; file is committed. `gen-config.mjs` refuses to build an OTA-enabled image
; without one.
;
; Requires the dual-slot partition table above. A board still running a
; huge_app.csv image CANNOT receive this — it has one app slot and nothing to
; write into, so the first delivery after that change is always over USB.
[env:m5-atom-ota]
extends = env:m5-atom
upload_protocol = espota
