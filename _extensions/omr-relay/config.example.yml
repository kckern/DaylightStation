# Example schema for the omr-relay SSOT. The REAL file lives in household
# data (private, Dropbox-synced), NOT in this repo:
#   data/household/hardware/omr/readers.yml
#
# A registry: each key under `scanners:` is one physical OMR reader + its relay
# ATOM. Add more keys and flash one ATOM per key with the matching id.
# Regenerate + reflash after editing:
#   node firmware/tools/flash.mjs <dataDir>/household/hardware/omr/readers.yml <id>

provisioning:
  wifi_ssid: "YOUR_SSID"
  wifi_password: "YOUR_WIFI_PASSWORD"

backend:
  host: "daylightlocal.kckern.net"   # DaylightStation backend (event-bus host)
  port: 3111                         # event-bus WS port
  ws_path: /ws

scanners:
  study-omr:
    label: "Study OMR-1100"
    device:
      board: m5-atom-lite            # ESP32-PICO-D4; button GPIO39, RGB GPIO27
    serial:
      # VERIFIED 2026-07-21 on the real OMR-1100 (fw 1.04) and confirmed by the
      # operator manual. 8N1 produces SILENCE, not garbage — don't "correct" it.
      baud: 9600
      framing: "7E1"                 # 7 data bits, EVEN parity, 1 stop
      # CONFIRMED 2026-07-29: the ATOMIC RS232 base's own silkscreen reads
      # "RX:22  TX:19". No longer an assumption.
      rx_pin: 22                     # ATOM base UART RX
      tx_pin: 19                     # ATOM base UART TX <- REQUIRED (mode download is sent on TX)
    sniff_mode: false                # decode sheets; set true only to re-investigate framing
    topic: omr

    # ---- optional OTA (over-the-air firmware updates) -----------------------
    # Needs the dual-slot partition table in platformio.ini (min_spiffs.csv).
    # The previous huge_app.csv had ONE app slot and could not OTA at all, so
    # every fix meant taking the reader apart for a USB cable. The FIRST flash
    # after that change is still USB — the partition table lives at 0x8000,
    # outside any app slot, and cannot be delivered over the air.
    #
    #   PLATFORMIO_UPLOAD_FLAGS="--auth=<password>" \
    #     pio run -e m5-atom-ota -t upload --upload-port <device-ip>
    #
    # gen-config.mjs HARD-ERRORS on enabled-without-password. The board's
    # diagnostics server on :80 is unauthenticated and read-only by design; an
    # open flash endpoint beside it is a much bigger door, and forgetting a line
    # must not be what opens it.
    ota:
      enabled: false
      password: ""                   # required when enabled; keep it out of the repo

    # ---- optional NFC tap reader -------------------------------------------
    # M5 Unit NFC (SKU U216, ST25R3916) on the ATOM's Grove port. Lets a student
    # tap a card to start a session; the relay emits an `nfc` message over the
    # same bus link the sheets use.
    #
    # Verified on hardware 2026-07-29: ST25R3916 at I2C 0x50, IC Identity 0x2A
    # (ic_type 5, silicon rev 2); an NTAG 215 read as uid 04669C0FCB2A81.
    #
    # Grove is GPIO26/32 and the OMR UART is GPIO22/19, so there is no conflict —
    # and gen-config.mjs rejects the file outright if they ever do collide.
    nfc:
      enabled: false                 # true only on readers that have the unit fitted
      sda_pin: 26                    # ATOM Lite Grove SDA
      scl_pin: 32                    # ATOM Lite Grove SCL
      i2c_hz: 400000
      poll_ms: 40                    # gap between detect attempts
      detect_timeout_ms: 120         # NOT the library's 1000ms default — see main.cpp
      # Only NFC-A (ISO14443A: MIFARE / NTAG) is polled. The ST25R3916 also does
      # NFC-B / FeliCa / ISO15693, but the chip holds ONE technology at a time and
      # it must be selected before init — so covering more means round-robin
      # re-initialisation, not just another flag here.

    # ---- optional buzzer (audible tap ACK) ---------------------------------
    # A status LED is useless once the board is in a case, so a tap needs sound.
    # Active (self-oscillating) buzzer wired GND + one free pad on the RS232
    # base. Only GPIO23 and GPIO33 are broken out free; gen-config enforces that.
    buzzer:
      enabled: false
      pin: 23                        # 23 or 33 only
      duty: 255                      # FULL. Lower duty SCRATCHES, it does not quieten
      freq_hz: 30000                 # ultrasonic gate rate, inaudible by design

      # active  = self-oscillating buzzer. ONE fixed pitch; `tone` below is
      #           IGNORED, so meaning must come from RHYTHM.
      # passive = piezo transducer. `tone` sets real pitch, so low->high /
      #           high->low patterns work.
      # Measured 2026-07-29 on the active unit fitted here: PWM duty could not
      # make it quieter, only dirtier. Pitch is a hardware property, not a
      # firmware one — swap the element to get it.
      kind: active

      # How long to wait for the server to echo a message back before calling it
      # failed. The relay subscribes to its own topic, so the backend's
      # re-broadcast IS the ack: proof it was received, validated and accepted.
      # NOT proof it reached disk — the backend persists just after broadcasting.
      ack_timeout_ms: 2000

      # Sound vocabulary. Each step is { tone, ms, gap }: sound for `ms`, then
      # silence for `gap`. Max 8 steps per pattern.
      #   read      — a card/sheet was read here, locally
      #   confirmed — the server echoed it; the round trip closed
      #   failed    — no echo inside ack_timeout_ms
      sounds:
        read:      [{ ms: 4 }]                     # the gentle tick
        confirmed: [{ ms: 4, gap: 60 }, { ms: 4 }] # tick-tick
        failed:    [{ ms: 250 }]                   # one long buzz
      # With kind: passive, the same table gains pitch — gen-config warns if you
      # set `tone` while kind is active, rather than letting it silently do
      # nothing:
      #   confirmed: [{ tone: 880, ms: 60 }, { tone: 1320, ms: 90 }]   # low -> high
      #   failed:    [{ tone: 1320, ms: 60 }, { tone: 660, ms: 140 }]  # high -> low
