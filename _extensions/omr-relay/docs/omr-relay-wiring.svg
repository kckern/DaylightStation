<svg xmlns="http://www.w3.org/2000/svg" width="792" height="612" viewBox="0 0 792 612">
  <rect x="0" y="0" width="792" height="612" fill="#ffffff"/>

  <!-- ── header ─────────────────────────────────────────────────────── -->
  <text x="40" y="46" font-family="Helvetica" font-weight="bold" font-size="20" fill="#111111">OMR-1100 RS-232 tap &#8212; wiring schematic</text>
  <text x="40" y="66" font-family="Helvetica" font-size="11" fill="#555555">Three wires. DB9 screw-terminal breakout into the M5Stack ATOMIC RS232 base (MAX3232). Verified end-to-end 2026-07-30 &#8212; two cards decoded.</text>
  <line x1="40" y1="78" x2="752" y2="78" stroke="#cccccc" stroke-width="1"/>

  <!-- ── reader ─────────────────────────────────────────────────────── -->
  <rect x="40" y="168" width="132" height="104" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
  <text x="106" y="196" text-anchor="middle" font-family="Helvetica" font-weight="bold" font-size="12" fill="#111111">Chatsworth Data</text>
  <text x="106" y="214" text-anchor="middle" font-family="Helvetica" font-weight="bold" font-size="14" fill="#111111">OMR-1100</text>
  <text x="106" y="234" text-anchor="middle" font-family="Helvetica" font-size="9.5" fill="#555555">bubble-sheet reader</text>
  <text x="106" y="252" text-anchor="middle" font-family="Helvetica" font-size="9.5" fill="#555555">6-pin circular port</text>
  <text x="106" y="292" text-anchor="middle" font-family="Helvetica" font-size="9" fill="#a03000">own mains PSU</text>
  <text x="106" y="304" text-anchor="middle" font-family="Helvetica" font-size="9" fill="#a03000">do NOT back-power</text>

  <!-- reader -> db9 cable -->
  <line x1="172" y1="220" x2="236" y2="220" stroke="#333333" stroke-width="2.5"/>
  <text x="204" y="206" text-anchor="middle" font-family="Helvetica" font-size="9" fill="#555555">original</text>
  <text x="204" y="240" text-anchor="middle" font-family="Helvetica" font-size="9" fill="#555555">cable</text>

  <!-- ── DB9 breakout ───────────────────────────────────────────────── -->
  <text x="318" y="128" text-anchor="middle" font-family="Helvetica" font-weight="bold" font-size="11" fill="#111111">DB9 screw-terminal breakout</text>
  <text x="318" y="142" text-anchor="middle" font-family="Helvetica" font-size="9" fill="#555555">(cable end presents PC / DTE orientation)</text>
  <rect x="236" y="152" width="164" height="212" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>

  <rect x="240" y="178" width="156" height="22" fill="#fde3cf"/>
  <rect x="240" y="200" width="156" height="22" fill="#d6e8f7"/>
  <rect x="240" y="244" width="156" height="22" fill="#e2e2e2"/>

  <text x="256" y="171" font-family="Courier" font-size="11" fill="#999999">1   DCD</text>
  <text x="256" y="193" font-family="Courier" font-weight="bold" font-size="11" fill="#111111">2   RXD</text>
  <text x="256" y="215" font-family="Courier" font-weight="bold" font-size="11" fill="#111111">3   TXD</text>
  <text x="256" y="237" font-family="Courier" font-size="11" fill="#999999">4   DTR</text>
  <text x="256" y="259" font-family="Courier" font-weight="bold" font-size="11" fill="#111111">5   GND</text>
  <text x="256" y="281" font-family="Courier" font-size="11" fill="#999999">6   DSR</text>
  <text x="256" y="303" font-family="Courier" font-size="11" fill="#999999">7   RTS</text>
  <text x="256" y="325" font-family="Courier" font-size="11" fill="#999999">8   CTS</text>
  <text x="256" y="347" font-family="Courier" font-size="11" fill="#999999">9   RI</text>

  <text x="392" y="171" text-anchor="end" font-family="Helvetica" font-size="8.5" fill="#999999">unused</text>
  <text x="392" y="237" text-anchor="end" font-family="Helvetica" font-size="8.5" fill="#999999">unused</text>
  <text x="392" y="281" text-anchor="end" font-family="Helvetica" font-size="8.5" fill="#999999">unused</text>
  <text x="392" y="303" text-anchor="end" font-family="Helvetica" font-size="8.5" fill="#999999">unused</text>
  <text x="392" y="325" text-anchor="end" font-family="Helvetica" font-size="8.5" fill="#999999">unused</text>
  <text x="392" y="347" text-anchor="end" font-family="Helvetica" font-size="8.5" fill="#999999">unused</text>

  <!-- ── the three wires ────────────────────────────────────────────── -->
  <!-- pin 2 RXD -> T  (data OUT of the reader). The wires CROSS: the base names
       its terminals for the FAR device, not for the ESP32. Measured 2026-07-30. -->
  <polyline points="400,189 436,189 436,242 542,242" fill="none" stroke="#d2691e" stroke-width="3"/>
  <polygon points="542,242 530,237 530,247" fill="#d2691e"/>
  <text x="499" y="236" text-anchor="middle" font-family="Helvetica" font-weight="bold" font-size="9" fill="#a0521e">reader data out</text>

  <!-- pin 3 TXD <- R  (host commands IN) -->
  <polyline points="542,205 478,205 478,211 400,211" fill="none" stroke="#1f6fb2" stroke-width="3"/>
  <polygon points="400,211 412,206 412,216" fill="#1f6fb2"/>
  <text x="488" y="199" text-anchor="middle" font-family="Helvetica" font-weight="bold" font-size="9" fill="#1f6fb2">host cmds in (I00)</text>

  <!-- pin 5 GND -> G -->
  <polyline points="400,255 430,255 430,300 542,300" fill="none" stroke="#111111" stroke-width="3"/>
  <text x="490" y="292" text-anchor="middle" font-family="Helvetica" font-weight="bold" font-size="9" fill="#111111">signal ground</text>

  <!-- ── ATOMIC RS232 base ──────────────────────────────────────────── -->
  <rect x="542" y="152" width="172" height="212" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="628" y="171" text-anchor="middle" font-family="Helvetica" font-weight="bold" font-size="10.5" fill="#111111">ATOMIC RS232 base</text>
  <text x="628" y="184" text-anchor="middle" font-family="Helvetica" font-size="8.5" fill="#555555">MAX3232 &#183; 4 screw terminals</text>

  <rect x="546" y="192" width="164" height="26" fill="#d6e8f7"/>
  <rect x="546" y="229" width="164" height="26" fill="#fde3cf"/>
  <rect x="546" y="287" width="164" height="26" fill="#e2e2e2"/>

  <text x="566" y="211" font-family="Courier" font-weight="bold" font-size="14" fill="#111111">R</text>
  <text x="566" y="248" font-family="Courier" font-weight="bold" font-size="14" fill="#111111">T</text>
  <text x="566" y="306" font-family="Courier" font-weight="bold" font-size="14" fill="#111111">G</text>
  <text x="566" y="345" font-family="Courier" font-weight="bold" font-size="12" fill="#a03000">DC12V</text>

  <text x="700" y="211" text-anchor="end" font-family="Helvetica" font-size="9" fill="#555555">to DB9 pin 3</text>
  <text x="700" y="248" text-anchor="end" font-family="Helvetica" font-size="9" fill="#555555">from DB9 pin 2</text>
  <text x="700" y="306" text-anchor="end" font-family="Helvetica" font-size="9" fill="#555555">to DB9 pin 5</text>
  <text x="700" y="338" text-anchor="end" font-family="Helvetica" font-weight="bold" font-size="9" fill="#a03000">LEAVE OPEN</text>
  <text x="700" y="350" text-anchor="end" font-family="Helvetica" font-size="8.5" fill="#a03000">power in, not serial</text>

  <!-- ── ATOM Lite stacked on the base ──────────────────────────────── -->
  <rect x="542" y="92" width="172" height="54" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
  <text x="628" y="110" text-anchor="middle" font-family="Helvetica" font-weight="bold" font-size="11" fill="#111111">ATOM Lite (ESP32-PICO-D4)</text>
  <text x="628" y="124" text-anchor="middle" font-family="Courier" font-size="10" fill="#333333">RX GPIO22  &#183;  TX GPIO19</text>
  <text x="628" y="139" text-anchor="middle" font-family="Helvetica" font-size="8.5" fill="#555555">USB-C power &#183; WS /ws uplink</text>
  <line x1="628" y1="146" x2="628" y2="152" stroke="#333333" stroke-width="1.5"/>

  <!-- ── wire legend ────────────────────────────────────────────────── -->
  <text x="40" y="352" font-family="Helvetica" font-weight="bold" font-size="10" fill="#111111">Wire spec</text>
  <text x="40" y="367" font-family="Helvetica" font-size="9" fill="#555555">22 AWG SOLID core</text>
  <text x="40" y="379" font-family="Helvetica" font-size="9" fill="#555555">15&#8211;20 cm, strip 5&#8211;6 mm</text>
  <text x="40" y="391" font-family="Helvetica" font-size="9" fill="#555555">black for GND</text>
  <text x="40" y="403" font-family="Helvetica" font-size="9" fill="#555555">stranded frays out of the</text>
  <text x="40" y="415" font-family="Helvetica" font-size="9" fill="#555555">clamp &#8212; tin or ferrule it</text>

  <!-- ── notes ──────────────────────────────────────────────────────── -->
  <line x1="40" y1="440" x2="752" y2="440" stroke="#cccccc" stroke-width="1"/>

  <text x="40" y="462" font-family="Helvetica" font-weight="bold" font-size="11" fill="#111111">Hazards</text>
  <text x="40" y="480" font-family="Helvetica" font-size="9.5" fill="#333333">&#183;  DC12V is the base's power input, NOT a serial line. Nothing from</text>
  <text x="52" y="493" font-family="Helvetica" font-size="9.5" fill="#333333">the reader touches it. Power the ATOM over USB-C.</text>
  <text x="40" y="511" font-family="Helvetica" font-size="9.5" fill="#333333">&#183;  NEVER wire the reader's TX straight to a bare ATOM GPIO. RS-232</text>
  <text x="52" y="524" font-family="Helvetica" font-size="9.5" fill="#333333">swings &#177;5&#8211;12 V and will fry the 3.3 V pin. It must pass through</text>
  <text x="52" y="537" font-family="Helvetica" font-size="9.5" fill="#333333">the MAX3232 &#8212; the screw terminal is on its RS-232 side.</text>
  <text x="40" y="555" font-family="Helvetica" font-size="9.5" fill="#333333">&#183;  Do not back-power the reader; it has its own external mains PSU.</text>

  <text x="410" y="462" font-family="Helvetica" font-weight="bold" font-size="11" fill="#111111">Why only three</text>
  <text x="410" y="480" font-family="Helvetica" font-size="9.5" fill="#333333">&#183;  No handshake lines. This unit's EEPROM flags byte reads 00 &#8212; flow</text>
  <text x="422" y="493" font-family="Helvetica" font-size="9.5" fill="#333333">control off, so DCD/DTR/DSR/RTS/CTS/RI all stay unconnected.</text>
  <text x="410" y="511" font-family="Helvetica" font-size="9.5" fill="#333333">&#183;  The link is BIDIRECTIONAL &#8212; T is not optional. The host must send</text>
  <text x="422" y="524" font-family="Helvetica" font-size="9.5" fill="#333333">the I00 mode download or the reader emits nothing at all.</text>
  <text x="410" y="542" font-family="Helvetica" font-weight="bold" font-size="9.5" fill="#a03000">&#183;  THE LABELS CROSS. Pin 2 goes to T and pin 3 to R &#8212; the base names</text>
  <text x="422" y="555" font-family="Helvetica" font-size="9.5" fill="#a03000">its terminals for the FAR device, not for the ESP32. Wired the</text>
  <text x="422" y="568" font-family="Helvetica" font-size="9.5" fill="#a03000">intuitive way (2&#8594;R, 3&#8594;T) the link is totally silent.</text>

  <text x="752" y="592" text-anchor="end" font-family="Helvetica" font-size="8" fill="#999999">_extensions/omr-relay &#183; source: docs/omr-relay-wiring.svg</text>
</svg>
