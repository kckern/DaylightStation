// shell-api — the ONE contract between the shell APK and a hot-swappable payload.
// An Android LIBRARY (not pure Java) only because PianoEngine — the JNI facade whose
// native .so ships in the shell — logs via android.util.Log. Both the shell and the
// payload compile against this module, so neither can drift from the other.
// The payload gets these classes from the SHELL at runtime (compileOnly); they are
// never bundled into a payload dex.
plugins { id 'com.android.library' }
android {
    namespace 'net.kckern.pianobridge.api'
    compileSdk 33
    defaultConfig { minSdk 29 }
    buildFeatures { buildConfig false }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
