; M5Stack ATOM Lite / ESP32-PICO-D4, 4 MB. RFID2 on HY2.0 port:
; SDA GPIO26, SCL GPIO32, I2C address 0x28.
[env:m5-atom]
platform = espressif32@6.5.0
board = m5stack-atom
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
upload_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=1
lib_deps = bblanchon/ArduinoJson@7.4.3

[env:m5-atom-ota]
extends = env:m5-atom
upload_protocol = espota
