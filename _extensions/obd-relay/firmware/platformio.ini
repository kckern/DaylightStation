; DaylightStation obd-relay firmware — Freematics ONE+ Model B
; (ESP32 16MB flash / 8MB PSRAM, u-blox M9 GNSS, SIM7670 LTE, OBD co-processor).
;
; Trips log to onboard flash while driving; buffered trips + live snapshots go
; over WebSocket to the DaylightStation event bus (/ws) whenever the car is on
; home WiFi. See ../README.md and docs/_wip/plans/2026-07-14-obd-relay-design.md.
;
; PREREQ (one-time): generate include/config.h from the household SSOT —
;   node tools/gen-config.mjs <dataDir>/household/config/vehicles.yml [vehicle-id]
; PREREQ (hardware env): vendor the FreematicsPlus library —
;   node tools/fetch-libs.mjs
;
; Build + flash:
;   node tools/flash.mjs [--port /dev/cu.xxx]
;
; ── MEASURED ON DEVICE 2026-07-30 ────────────────────────────────────────────
; Bench bring-up, unit connected over microUSB (CH340 → /dev/cu.wchusbserial*):
;   esptool flash_id → ESP32-D0WDQ6 rev v1.1, dual core, 40MHz crystal
;                      flash ef:4018 (Winbond W25Q128) = 16MB CONFIRMED
; Settings below are now measured or matched to the vendor's firmware_v5
; telelogger platformio.ini, not inferred. Remaining unknown: external PSRAM
; presence (see BOARD_HAS_PSRAM note under build_flags).

[common]
framework = arduino
monitor_speed = 115200
lib_deps =
  links2004/WebSockets@^2.4.1     ; arduinoWebSockets (WS client)
  bblanchon/ArduinoJson@^7.1.0

; ── hardware target: Freematics ONE+ Model B ────────────────────────────────
[env:freematics-oneplus-b]
platform = espressif32@6.5.0      ; pinned like the sibling relays (Arduino core 2.x)
board = esp32dev                  ; MEASURED: ESP32-D0WDQ6 (vendor uses esp-wrover-kit,
                                  ; a PSRAM board def we don't need — see PSRAM note)
board_build.flash_size = 16MB     ; MEASURED: Winbond W25Q128 = 16MB
board_build.partitions = partitions_16mb_trips.csv  ; 2MB app slots + ~12MB trip buffer
; BOTH upload keys are REQUIRED, and their absence is a boot-loop trap:
; PlatformIO writes the esptool image header from board_upload.flash_size, NOT
; from board_build.flash_size. With only the build key set, the bootloader still
; believed it had 4MB, could not reach any partition past that boundary, and
; reset in a tight loop (rst:0x3 SW_RESET, no application output) — measured on
; this unit 2026-07-30, and it reproduced with the Freematics layer compiled out,
; which is what proved the layout rather than the library was at fault.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags =
  -DCORE_DEBUG_LEVEL=1
  ; -DBOARD_HAS_PSRAM           ; OFF, matching vendor telelogger (they ship it commented out).
                                  ; Chip is D0WDQ6 = no in-package PSRAM; external PSRAM presence
                                  ; is UNVERIFIED. We use ~14% of internal RAM, so we don't need
                                  ; it. Enabling it blind risks a boot-time PSRAM init failure.
  -DUSE_FREEMATICS              ; enables OBD co-processor + GNSS code paths
lib_deps =
  ${common.lib_deps}
  ; FreematicsPlus is vendored into lib/ by tools/fetch-libs.mjs (the vendor
  ; repo is not a registry package and the library lives in a subfolder).

; ── bisect target: 16MB layout WITHOUT the Freematics layer ─────────────────
; Exists to separate two variables that the bench env conflates: the bench env
; differs from the hardware env BOTH by -DUSE_FREEMATICS and by the partition
; table. This env holds the 16MB layout and drops only USE_FREEMATICS, so a
; boot loop here indicts the partition/flash config rather than the library.
[env:bisect-16mb-nofreematics]
platform = espressif32@6.5.0
board = esp32dev
board_build.flash_size = 16MB
board_build.partitions = partitions_16mb_trips.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DBENCH_SIM
lib_deps = ${common.lib_deps}

; ── bench target: transport layer only, any dev ESP32 ───────────────────────
; Builds WITHOUT FreematicsPlus: WiFi + WS + trip buffer + simulated samples.
; Lets the WS/buffering/upload logic be exercised before the hardware arrives.
[env:bench-esp32]
platform = espressif32@6.5.0
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DBENCH_SIM                   ; fabricate OBD/GNSS samples instead of reading hardware
lib_deps = ${common.lib_deps}
