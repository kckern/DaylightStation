; DaylightStation pressure-mat-relay — Applied Sensor Co. TrampleTek Blue.
;
; Hardware verified on the attached unit:
;   WEMOS LOLIN C3 Mini, ESP32-C3 rev 0.4, 4 MB flash
;   pressure divider on ADC GPIO0, onboard WS2812 RGB LED on GPIO7
;
; Build + flash:
;   node tools/flash.mjs <dataDir>/household/config/pressure-mats.yml [mat-id]
; or directly:
;   pio run -e trampletek-blue -t upload --upload-port /dev/cu.usbmodemXXXX

[env:trampletek-blue]
platform = espressif32@6.5.0
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = default.csv
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  links2004/WebSockets@^2.4.1
  bblanchon/ArduinoJson@^7.1.0

; Authenticated OTA delivery. The base environment's default.csv already has
; two 0x140000-byte OTA app slots; the current image fits in either one.
; Use tools/ota.mjs so the password never appears in the shell command line.
[env:trampletek-blue-ota]
extends = env:trampletek-blue
upload_protocol = espota
