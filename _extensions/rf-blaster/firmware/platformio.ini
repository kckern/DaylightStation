; DaylightStation rf-blaster firmware — M5Stack ATOM Lite (ESP32-PICO-D4).
;
; A config-driven 433 MHz OOK transmitter *and* learner. Named codes
; (disco_on, disco_off, …) are stored in the household SSOT as raw microsecond
; mark/space timings and replayed on a cheap 433 MHz TX module via the ESP32's
; RMT peripheral with the carrier DISABLED — i.e. baseband on/off keying, which
; is what EV1527/PT2262-class remotes actually speak.
;
; This is the sibling of ../../ir-blaster. Same SSOT-driven shape, same HTTP
; surface. The one structural difference: IR here is transmit-only, but a 433
; receiver costs $2, so this board can LEARN a remote instead of borrowing
; codes captured elsewhere. See ../LEARNING.md.
;
; PREREQ (one-time): generate include/config.h from the household SSOT —
;   node tools/gen-config.mjs <dataDir>/household/config/rf-blasters.yml [blaster-id]
;
; Build + flash:
;   node tools/flash.mjs <dataDir>/household/config/rf-blasters.yml [blaster-id] [--port /dev/cu.usbserial-XXXX]
; or directly:
;   pio run -e m5-atom -t upload --upload-port /dev/cu.usbserial-XXXX

[env:m5-atom]
; Pinned to match the rest of the ATOM fleet (ir-blaster, kitchen-relay, …).
; 6.5.0 ships Arduino-ESP32 2.0.x (IDF 4.4), where RMT is driver/rmt.h.
platform = espressif32@6.5.0
board = m5stack-atom              ; ESP32-PICO-D4; SK6812 RGB GPIO27, button GPIO39
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  bblanchon/ArduinoJson@^7.1.0
  fastled/FastLED@^3.6.0                ; single onboard RGB status LED
; NOTE: no RF library. rc-switch is deliberately NOT used — it only understands
; the protocols it ships with, and silently declines anything else. Raw timings
; replay whatever the remote actually sent, including protocols nobody named.
