// Test helpers shared by core and every capability. Never part of a payload:
// modules depend on it with testImplementation only.
apply plugin: 'com.android.library'

android {
    namespace 'net.kckern.daylight.core.testing'
    compileSdk 33
    defaultConfig { minSdk 26 }
    buildFeatures { buildConfig false }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    api project(':core')
    api project(':shell-api')
    api 'org.nanohttpd:nanohttpd-websocket:2.3.1'
    api 'org.json:json:20231013'
}
