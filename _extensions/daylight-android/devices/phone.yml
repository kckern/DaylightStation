# The owner's phone. Sideloaded. Not a kiosk: no lockdown, so it is never offered as the
# home app. Reaches the backend over the always-on VPN at the address the kiosks use.
# Nothing here has run on a phone yet.
id: phone
package: net.kckern.daylight.phone
android: { minSdk: 26, targetSdk: 33 }
abis: []
# bind: loopback. A phone joins networks outside the house, so its control API and its
# lifeline listen on the loopback address only. The fleet CLI reaches it through
# `adb forward tcp:8780 tcp:8780` (and 8781 for the lifeline) with host 127.0.0.1.
control: { port: 8780, lifelinePort: 8781, bind: loopback }
shell: { versionCode: 1, versionName: "0.1-phone" }
# The household site's host, so an https link to it (in a relayed push, say) can open in
# the app. Private: resolved from `placeholders:` when this device's manifest is built.
appLinks: { host: "{phone_link_host}" }
capabilities:
  - webview-host
  - app-launcher
  - volume
  - debug-tools
  - notifications
  - bookmarks
  - one-tap-actions
defaults:
  # The household site as the phone reaches it: a full https URL, resolved from
  # `placeholders:` in the private tokens file when the payload is built.
  webview.startUrl: "{phone_start_url}"
  # Back steps through the page history and then leaves the app, as in any phone app.
  webview.backButton: "history"
  debug.execEnabled: false
  # The pages the site's own web manifest offers as shortcuts (frontend/public/manifest.json).
  # Each is "id|label|icon|path"; a path is a page of the site, never an API route.
  bookmarks.1: "feed|Feed|open|/feed"
  bookmarks.2: "media|Media|play|/media"
  bookmarks.3: "call|Call|open|/call"
  # One-tap actions, defined once here and shown as launcher shortcuts, tiles and the
  # widget. Each is "id|label|icon|target"; a target is open:/page, bookmark:<id>,
  # memo:new, media:<content id> or api:/api/... (an empty POST to that path).
  # "New memo" is a stand-in until the voice-memo capability is built: it opens the app
  # at actions.memoFallbackPath and records nothing.
  actions.1: "memo|New memo|mic|memo:new"
  actions.2: "media|Media|play|bookmark:media"
  actions.3: "feed|Feed|open|bookmark:feed"
  actions.4: "call|Call|open|bookmark:call"
  # A web link opens in the app only on the backend's own origin or one listed here.
  # This is the host the link activity is offered for (appLinks above).
  links.origins: "https://{phone_link_host}"
  # Decided for every device: heartbeats on, shipped to the household log store. On the
  # phone they are the only view of the app from outside it, since its control API is
  # loopback only. They go out over the VPN and are dropped when it is down.
  heartbeat.enabled: true
  heartbeat.logStoreUrl: "{log_store_insert_url}"
