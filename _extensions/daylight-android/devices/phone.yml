# The owner's phone. Sideloaded. Not a kiosk: no lockdown, so it is never offered as the
# home app. Reaches the backend over the always-on VPN at the address the kiosks use.
# Nothing here has run on a phone yet.
id: phone
package: net.kckern.daylight.phone
android: { minSdk: 26, targetSdk: 33 }
abis: []
# bind: none. A phone joins networks outside the house, and every app installed on it can
# reach its loopback address, so this build starts no control server and no lifeline at
# all. Its installed components (the link activity, the tiles, the widget) reach the
# payload in-process. Debugging is over adb: logcat, and run-as for its files.
control: { port: 8780, lifelinePort: 8781, bind: none }
shell: { versionCode: 17, versionName: "0.1-phone" }
# The household site's host, so an https link to it (in a relayed push, say) can open in
# the app. Private: resolved from `placeholders:` when this device's manifest is built.
appLinks: { host: "{phone_link_host}" }
capabilities:
  - webview-host
  - volume
  - notifications
  - bookmarks
  - one-tap-actions
  - widgets
  - media-service
  - android-auto
  - voice-memo
defaults:
  # The household site as the phone reaches it: a full https URL, resolved from
  # `placeholders:` in the private tokens file when the payload is built.
  webview.startUrl: "{phone_start_url}"
  # Somebody's own phone: the site (admin, finance, health) stays behind the lock screen,
  # and no page is given the microphone or the camera. Calling from the phone is not
  # in scope yet; voice memos record through the app's own recorder, not through a page.
  webview.showWhenLocked: false
  webview.allowMic: false
  webview.allowCamera: false
  # The household user this phone acts for, where a backend route takes one (the memo
  # upload does, and sends nothing without it). A name from the private file, never
  # written here.
  identity.user: "{phone_user}"
  # Back steps through the page history and then leaves the app, as in any phone app.
  webview.backButton: "history"
  # The pages the site's own web manifest offers as shortcuts (frontend/public/manifest.json).
  # Each is "id|label|icon|path"; a path is a page of the site, never an API route.
  bookmarks.1: "feed|Feed|open|/feed"
  bookmarks.2: "media|Media|play|/media"
  bookmarks.3: "call|Call|open|/call"
  # One-tap actions, defined once here and shown as launcher shortcuts, tiles and the
  # widget. Each is "id|label|icon|target"; a target is open:/page, bookmark:<id>,
  # memo:new, media:<content id> or api:/api/... (an empty POST to that path).
  # "New memo" opens the recorder (the voice-memo capability); tapped again while a memo
  # is being recorded, it stops and saves it.
  actions.1: "memo|New memo|mic|memo:new"
  actions.2: "media|Media|play|bookmark:media"
  actions.3: "feed|Feed|open|bookmark:feed"
  actions.4: "call|Call|open|bookmark:call"
  # Launcher (long-press) shortcuts, in order, and the action of each quick-settings
  # slot ("Daylight 1" to "Daylight 4"; an empty entry leaves a slot unassigned).
  actions.shortcuts: "memo,media,feed,call"
  actions.tiles: "memo"
  # The four buttons of the "Daylight actions" home-screen widget, in order.
  widgets.actions: "memo,media,feed,call"
  # The tabs a car (and any media browser) shows, at most four: "Label=target;...", a
  # target being recent, catalog or a container's content id.
  media.roots: "Recent=recent;Browse=catalog"
  # The apps that may connect to the media session beside this app and the system (a
  # car, an assistant): "package=sha256 of its signing certificate", comma-separated.
  # Empty: none, so the first connection from a car is refused and logged with the entry
  # to add here. See "Who may connect" in __docs/reference/android/phone.md.
  media.controllerPins: ""
  # A web link opens in the app only on the backend's own origin or one listed here.
  # This is the host the link activity is offered for (appLinks above).
  links.origins: "https://{phone_link_host}"
  # No heartbeats and no log shipping from somebody's own phone: it is not a household
  # device to be watched. With no log store URL nothing leaves the phone.
  heartbeat.enabled: false
