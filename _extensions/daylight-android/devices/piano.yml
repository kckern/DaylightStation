# Piano tablet (Samsung SM-T590, Android 10). Helpers only; the kiosk arrives in phase 3.
id: piano
package: net.kckern.daylight.piano
android: { minSdk: 29, targetSdk: 29 }
# armeabi-v7a is the tablet. arm64-v8a is for an emulator or a replacement tablet.
abis: [armeabi-v7a, arm64-v8a]
control: { port: 8780, lifelinePort: 8781 }
shell: { versionCode: 8, versionName: "0.2-helpers" }
foregroundServiceTypes: [mediaPlayback]
# Declared now, as the piano-bridge shell did, because a payload update cannot add a
# permission: that takes an install and a tap on the tablet.
permissions:
  - android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK
  - android.permission.CHANGE_WIFI_STATE
  - android.permission.VIBRATE
  - android.permission.SYSTEM_ALERT_WINDOW
  - android.permission.QUERY_ALL_PACKAGES
capabilities:
  - debug-tools
  - accessibility
  - synth              # before midi-bridge: a key press reaches sound first
  - midi-bridge
  - bluetooth-controls
  - audio-guard
defaults:
  debug.execEnabled: false
  # Keeps today's log store identity so existing queries and the backend supervisor
  # still match. It becomes daylight-piano at the tablet's cutover.
  logstore.app: piano-bridge
  heartbeat.enabled: true
  # Where heartbeats and log lines are shipped. Household-specific: resolved from
  # `placeholders:` in the private tokens file when this device's payload is built.
  heartbeat.logStoreUrl: "{log_store_insert_url}"
  # The identity the old bridge's heartbeats carry, so the backend supervisor and
  # existing log queries keep matching. Household-specific: resolved from the private file.
  heartbeat.deviceId: "{piano_heartbeat_device}"
  # The app turns its own accessibility service on (needs WRITE_SECURE_SETTINGS over ADB).
  accessibility.selfEnable: true
  # The app confirms its own update dialog through accessibility. Its own package only.
  update.autoConfirm: true
  # The instrument's MIDI router, and addresses the link must never connect to.
  midi.targetMac: "{piano_midi_mac}"
  midi.targetName: "{piano_midi_name}"
  midi.blocklistMacs: "{piano_midi_blocklist}"
  # The speaker's identity.
  speaker.mac: "{piano_speaker_mac}"
  speaker.name: "{piano_speaker_name}"
  # The Bluetooth panel manages the instrument and speaker links above.
  bluetooth.mode: roles
