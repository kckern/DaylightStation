# Piano tablet (Samsung SM-T590, Android 10). Helpers, the kiosk window, lockdown (built in, off until the home app is switched), screen power, volume and the app launcher.
id: piano
package: net.kckern.daylight.piano
android: { minSdk: 29, targetSdk: 29 }
# armeabi-v7a is the tablet. arm64-v8a is for an emulator or a replacement tablet.
abis: [armeabi-v7a, arm64-v8a]
control: { port: 8780, lifelinePort: 8781 }
shell: { versionCode: 35, versionName: "0.3-kiosk" }
foregroundServiceTypes: [mediaPlayback]
# Declared now, as the piano-bridge shell did, because a payload update cannot add a
# permission: that takes an install and a tap on the tablet.
permissions:
  - android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK
  - android.permission.CHANGE_WIFI_STATE
  - android.permission.VIBRATE
  - android.permission.SYSTEM_ALERT_WINDOW
  - android.permission.QUERY_ALL_PACKAGES
capabilities:
  - webview-host
  - debug-tools
  - accessibility
  - lockdown
  - screen-power
  - volume
  - app-launcher
  - synth              # before midi-bridge: a key press reaches sound first
  - midi-bridge
  - bluetooth-controls
  - audio-guard
defaults:
  # The kiosk's start page: this device's full https URL. Household-specific, so it is
  # resolved from `placeholders:` in the private tokens file when the payload is built.
  # https only: a page gets the microphone and camera in a secure context alone.
  webview.startUrl: "{piano_start_url}"
  # A household screen: it shows over a swipe keyguard after a wake, and its page may be
  # given the microphone and the camera (each also needs the Android permission, granted
  # once over ADB). All three are off unless a device file turns them on.
  webview.showWhenLocked: true
  webview.allowMic: true
  webview.allowCamera: true
  # Lockdown is built in and off. Until this device's home app is switched (phases 4 to
  # 6) the app is installed beside Fully, and an armed watcher would recall itself over
  # Fully. The allowlist stays empty: it is read from Fully at this device's cutover.
  lockdown.enabled: false
  # launcher.allowed is not set: nothing may be launched from this kiosk. What Fully allows
  # today (the Bluetooth pairing dialog) is read from Fully at this device's cutover.
  debug.execEnabled: false
  # Coexistence switches. This app is installed beside the old helper app(s) before the
  # device is switched over, and two apps cannot hold the same hardware. Each switch
  # below is off, so installing takes nothing from the helper that runs the device
  # today. They are turned on at this device's cutover (`settings set <key> true`, applied
  # at once, reported in GET /status under "switches"), after the old helper is stopped,
  # and turned off again in a rollback. See __docs/runbooks/android/kiosk-cutover.md.
  midi.enabled: false          # the BLE-MIDI link to the instrument (piano-bridge holds it)
  speaker.enabled: false       # the A2DP connector and the audio route guard (piano-bridge)
  # Keeps today's log store identity so existing queries and the backend supervisor
  # still match. It becomes daylight-piano at the tablet's cutover.
  logstore.app: piano-bridge
  heartbeat.enabled: true
  # Where heartbeats and log lines are shipped. Household-specific: resolved from
  # `placeholders:` in the private tokens file when this device's payload is built.
  heartbeat.logStoreUrl: "{log_store_insert_url}"
  # The identity the old bridge's heartbeats carry, so the backend supervisor and
  # existing log queries keep matching. Household-specific: resolved from the private file.
  heartbeat.deviceId: "{piano_heartbeat_device}"
  # The app turns its own accessibility service on (needs WRITE_SECURE_SETTINGS over ADB).
  accessibility.selfEnable: true
  # The app confirms its own update dialog through accessibility. Its own package only.
  update.autoConfirm: true
  # The instrument's MIDI router, and addresses the link must never connect to.
  midi.targetMac: "{piano_midi_mac}"
  midi.targetName: "{piano_midi_name}"
  midi.blocklistMacs: "{piano_midi_blocklist}"
  # The speaker's identity.
  speaker.mac: "{piano_speaker_mac}"
  speaker.name: "{piano_speaker_name}"
  # The Bluetooth panel manages the instrument and speaker links above.
  bluetooth.mode: roles
