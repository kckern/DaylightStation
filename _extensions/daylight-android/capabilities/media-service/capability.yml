# Native audio playback of household media from the backend's content API. The payload
# owns the browse tree, which stream a media id resolves to, and the progress reports;
# the shell half hosts the Media3 player and library session (lock screen, headset and
# Android Auto controls come with the session). Owns the link kind daylight://media/play.
entry: net.kckern.daylight.cap.mediaservice.MediaServiceCapability
permissions:
  - android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK
  # The downloads kept on this phone (KeepService, foregroundServiceType dataSync).
  - android.permission.FOREGROUND_SERVICE_DATA_SYNC
  # Merged in by media3-common and media3-exoplayer; the base shell asks for it too.
  - android.permission.ACCESS_NETWORK_STATE
exported:
  # Bound by a car, the system's media controls and Bluetooth; ControllerPolicy decides
  # each connection by the caller's uid, package and signing certificate.
  - net.kckern.daylight.cap.mediaservice.shell.DaylightMediaService
  # Any app can broadcast a media button, so this is reachable by design. It only starts the
  # service above; ControllerPolicy still decides the connection, and with nothing queued
  # onPlaybackResumption resumes the last item played.
  - androidx.media3.session.MediaButtonReceiver
# A media link is keyed and arrives through the link activity.
requires:
  - notifications
