plugins { id 'com.android.application' }
android {
    namespace 'net.kckern.supervisionguard'
    compileSdk 33
    defaultConfig {
        applicationId 'net.kckern.supervisionguard'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
