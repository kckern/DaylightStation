name: "Transverse Abdominis"
slug: "transverse-abdominis"
group: "core"
description: "The deepest abdominal layer, wrapping the trunk horizontally like a corset. It stabilises the spine and pelvis rather than producing movement."
full_description: "The transverse abdominis is the innermost of the four abdominal muscles. Its fibres run horizontally, originating from the lower six costal cartilages, the thoracolumbar fascia, and the iliac crest, and inserting into the linea alba and pubic crest.\n\nUnlike the rectus abdominis and the obliques, it contributes almost nothing to spinal movement. Its role is compression and stabilisation: it draws the abdominal wall inward, raises intra-abdominal pressure, and braces the lumbar spine and pelvis before and during load. It typically activates fractionally ahead of limb movement, which is why it is described as an anticipatory stabiliser.\n\nPlanks, dead bugs, hollow holds, and any braced carry train it; so does deliberate abdominal bracing under a heavy barbell."
