; DaylightStation ticalc-relay — M5Stack ATOM-class ESP32.
;
; This first image is the electrically safe bring-up layer. It observes the
; protected TI link and exposes the SchoolCalc HTTP seam. TI packet transport
; belongs in the dedicated TiLinkTransport boundary in main.cpp.

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  links2004/WebSockets@^2.4.1
  bblanchon/ArduinoJson@^7.1.0
  fastled/FastLED@^3.6.0
  h2zero/NimBLE-Arduino@2.5.0

[env:m5-atom]
platform = espressif32@6.5.0
board = m5stack-atom
framework = ${env.framework}
monitor_speed = ${env.monitor_speed}
upload_speed = ${env.upload_speed}
board_build.partitions = ${env.board_build.partitions}
build_flags = ${env.build_flags}
lib_deps = ${env.lib_deps}

[env:bench-esp32]
platform = espressif32@6.5.0
board = esp32dev
framework = ${env.framework}
monitor_speed = ${env.monitor_speed}
build_flags = ${env.build_flags} -DBENCH_SIM
lib_deps = ${env.lib_deps}
