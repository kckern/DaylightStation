# Household work/config.yml. No credentials belong here.
work:
  enabled: false
  catchUp: false # Optional missed-hook read catch-up; requires authorized local writer.
  write: false
  writer_env: null
  writer_host: null
  operator_uid: null
  providerWrites: false
  importWrites: false
  proactive: false
  pollMinutes: 15
  snapshotMaxAgeHours: 24
  modelCallsPerLocalDay: 4
  backfillMaxDays: 90
  providers:
    personal:
      type: todoist
      accountId: personal
      authScope: user
      operations: [read]
  domains:
    personal:
      provider: personal
      containerId: sample-list
      role: tasks
      autoComplete: linked_explicit
    projects:
      provider: personal
      containerId: sample-project
      role: projects
      autoComplete: never
      # creationParentId: sample-parent # Explicit parent for project creation.
      # ClickUp projects can map code_checked_in to a live review status:
      # transitions: {code_checked_in: review, complete: closed, reopen: open}
  # Enroll each known user explicitly. Override maps replace the full base map.
  users:
    sample: {}
  attention:
    maxProactiveUnitsPerDay: 2
    maxHousekeepingPer7Days: 1
    itemCooldownDays: 30
    ignoredOffersBeforeQuiet: 2
    ignoredOfferHours: 36
    quietDays: 30
    staleRelevanceDays: 30
    offerExpiryHours: 24
    reviewWindows: [] # ISO weekdays, local HH:mm; no overnight windows.
    # reviewWindows: [{days: [1], start: "07:00", end: "09:00"}]
    housekeepingDomains: [] # Explicit domain opt-in; connection alone never opts in.
    rankerEnabled: false
