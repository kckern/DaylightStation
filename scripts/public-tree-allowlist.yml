# Binary / large-text gate for scripts/audit-public-tree.mjs (npm run audit:public).
# Every tracked binary, and every text file >= 100 KB, must match one of the three
# lists below by EXACT PATH or GLOB (* within a directory, ** across directories).
# Never by extension: a new PNG anywhere else fails CI. Third-party assets belong
# in assets.manifest.yml, not here.

# Binaries that legitimately stay in the repo: allowed fonts, app icons, gradle
# wrappers, tiny synthetic fixtures (several "binaries" below are 8-byte text stubs).
keep:
  - frontend/public/fonts/surround/*.woff2
  - frontend/public/fonts/atkinson-hyperlegible-next/*.woff2
  - frontend/public/fonts/kongtext.ttf
  - __backend/assets/fonts/roboto-condensed/*.ttf
  - __backend/assets/fonts/atkinson-hyperlegible/*.ttf
  - __backend/assets/fonts/kongtext/kongtext.ttf
  - __docs/assets/branding/Gabarito-VariableFont_wght.ttf
  - frontend/public/favicon.ico
  - frontend/public/icon-192.png
  - frontend/public/icon-512.png
  - frontend/public/apple-touch-icon.png
  - _extensions/audio-bridge/app/gradle/wrapper/gradle-wrapper.jar
  - __app_modules/learning/piano/satellites/piano-bridge/app/gradle/wrapper/gradle-wrapper.jar
  - frontend/src/lib/audio/speex_aec.js
  # Globs (not exact files) on purpose: these two trees are tiny synthetic stubs
  # (1x1 images, 8-byte "mp4" text) whose names are the test's own contract.
  - tests/_fixtures/exercise-library/**
  - tests/_fixtures/media/**
  - tests/_fixtures/midi/groove-*.mid
  # School print goldens: 8-bit grey 150 dpi pages of our own renderer. Pixel tolerance
  # means a hash cannot replace them; regenerate with UPDATE_GOLDEN=1 / UPDATE_PROOF=1.
  - tests/isolated/rendering/school/golden/snapshots/*.png
  - __app_modules/learning/school/server/application/documents/__proof__/phase-a/proof-standard-p02.png
  - __app_modules/learning/school/server/application/documents/__proof__/phase-b/kitchen-sink-student-p01.png
  - __app_modules/learning/school/server/application/documents/__proof__/phase-c/card-continuation-student-p01.png
  # Synthetic JamCorder recording, built by make-jamcorder-fixture.mjs (1 KB).
  - tests/fixtures/jamcorder/Jmx-A00005-Jan-02-2001.mid

# Text >= 100 KB that legitimately stays: lockfiles, one authored GUI source, and
# hand-written source/docs that are simply large (found by scanning HEAD; adding
# to this list needs a reason, a new generated or data blob does not qualify).
largeText:
  - package-lock.json
  - frontend/package-lock.json
  - __backend/package-lock.json
  - __app_modules/learning/school/satellites/ti86-app/gui/screens.yml
  - __app_modules/learning/piano/browser/PianoApp.scss
  - __app_modules/learning/piano/browser/PianoKiosk/modes/Exercises/ExerciseRun.component.test.jsx
  - __app_modules/learning/piano/browser/PianoKiosk/modes/Exercises/ExerciseRun.measure.test.jsx
  - __app_modules/learning/piano/browser/PianoKiosk/modes/SheetMusic/ScorePlayer.jsx
  - __app_modules/learning/piano/browser/PianoKiosk/modes/SheetMusic/ScorePlayer.test.jsx
  - __app_modules/learning/school/browser/Programs/SentenceLadder/SentenceLadderProgram.test.jsx
  - __app_modules/learning/school/browser/School.scss
  # Authored teacher-console styles; source is retained, not a generated/data blob.
  - __app_modules/learning/school/browser/teacher/Teacher.scss
  - __app_modules/learning/school/server/adapters/schoolcalc/ti86/Ti86SchoolCalcCodec.mjs
  - __app_modules/media/media/browser/surround/modules/SegmentMap.jsx
  - __app_modules/media/media/browser/surround/modules/SegmentMap.test.jsx
  - __app_modules/wellness/fitness/browser/context/FitnessContext.jsx
  - __app_modules/wellness/fitness/browser/hooks/fitness/FitnessSession.js
  - __app_modules/wellness/fitness/browser/hooks/fitness/GovernanceEngine.js
  - __backend/src/app.mjs
  - __capabilities/content-catalog/server/adapters/providers/plex/PlexAdapter.mjs
  - __capabilities/gaming/cli/gaming-assets/lib.mjs
  - __capabilities/playback/browser/player/Player.jsx
  - __capabilities/playback/browser/surround/band.measure.test.jsx
  - __capabilities/playback/server/adapters/surround/YamlSurroundStore.test.mjs
  - __docs/reference/health/README.md
  - __docs/reference/media/media-app-technical.md
  - __docs/reference/school/README.md
  - _extensions/playback-hub/playback-hub.sh

