# Decoy audit (why each list is honest): 풀 also means grass, so "Grass" is
# deliberately absent from its English decoys; 간식's Korean decoys avoid
# 과자 (a snack itself); 안녕 also means bye, so no plain "Goodbye" decoy is
# offered for it. In-set decoys are same-kind only: phrases 안녕하세요 /
# 안녕히계세요 / 안녕 / 선생님 / 친구들 and their English appear only under
# phrases; words 색종이 / 종이 / 색연필 / 연필 / 학교 / 한국 and their
# English only under words.
