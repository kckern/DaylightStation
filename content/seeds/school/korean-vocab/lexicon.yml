      english: [Knife, Tape, Ruler]
  - id: pul
    kind: word
    korean: 풀
    english: Glue
    pronunciation: null
    decoys:
      korean: [불, 뿔, 발]
      english: [Tape, Paint, Stapler]
  - id: chaek
    kind: word
    korean: 책
    english: Book
    pronunciation: null
    decoys:
      korean: [책상, 채소, 창]
