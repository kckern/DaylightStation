# Card ladder lexicon — the korean-vocab word package (Korean words, English meanings).
# Installed to media/school/language/korean-vocab/lexicon.yml.
# This file is the package's whole language identity: nothing in code names Korean.
# Ids are permanent once studied (status is keyed by them); `group` is the course
# unit that FIRST introduced the word and names its media folder
# (words/<group>/<id>/{image.jpg, term.mp3, gloss.mp3}). A later deck may reuse
# words from any group.
# Decoys: at least 3 per side, confusable, never the answer; an in-set decoy
# must be the same kind (phrase decoys only from phrases).
schema: school.word-lexicon/v2
package: korean-vocab
language:
  code: ko
  name: Korean
gloss:
  code: en
  name: English
program:
  title: Korean words
quiz:
  topics: [korean, vocabulary]
  instructions: Not sure of a word? Open Korean words on the Portal and review the cards, then come back.
